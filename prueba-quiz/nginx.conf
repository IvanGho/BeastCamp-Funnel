# Sitio estático del quiz BeastCamp (maqueta pre-lanzamiento). Solo lectura, noindex. Los envíos (/api/lead, /api/click) los atiende otro contenedor: Caddy los enruta.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Solo GET/HEAD: no hay nada que reciba datos.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # No indexar (además del meta robots y de robots.txt).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Todo local: sin scripts, estilos ni medios de terceros. El script y el estilo son de la propia página (en línea).
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /index.html { add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; add_header X-Content-Type-Options "nosniff" always; add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always; }
    location /img/ { add_header Cache-Control "public, max-age=3600" always; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; add_header X-Content-Type-Options "nosniff" always; }
    location /media/ { add_header Cache-Control "public, max-age=3600" always; add_header X-Robots-Tag "noindex, nofollow, noarchive" always; add_header X-Content-Type-Options "nosniff" always; }
    location / { try_files $uri $uri/ =404; }
}
