# BeastCamp: sitio estático + app + servicio Node, en un VPS con HTTPS.
# Va en /etc/nginx/conf.d/beastcamp.conf (se incluye dentro de `http {}`). Antes de usarlo hay que:
#   1) reemplazar DOMINIO (aparece abajo, en server_name y en las rutas de certbot) por el dominio real, sin https://;
#   2) apuntar `root` a la carpeta prueba-quiz/sitio del servidor;
#   3) tener el certificado de certbot (ver deploy/README.md) y el servicio escuchando en 127.0.0.1:3000.
# Reglas que no se tocan: CSP (nada de terceros), solo GET/HEAD en lo estático, solo GET/POST/PUT en /api/, noindex.
#
# Cómo se arman las cabeceras: los add_header están SOLO a nivel de `server`. En nginx, si un `location` define un
# add_header propio, pierde los del server; por eso en los location se usa `expires` (que no es add_header) para el caché.
#   expires -1   -> Cache-Control: no-cache (el navegador revalida siempre; con ETag es barato)
#   expires 30d  -> Cache-Control: max-age=2592000

# Registro de accesos SIN query string: /gracias/ llega con nombre y mail en la URL y no deben quedar en los logs.
log_format beastcamp '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

# --- HTTP: todo va a HTTPS, salvo el desafío de certbot ---
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ---
server {
    # `http2` en el listen sirve en todas las versiones de nginx (en 1.25.1 o más nueva avisa que está en desuso; sigue andando).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/beastcamp/prueba-quiz/sitio;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    access_log /var/log/nginx/beastcamp.access.log beastcamp;

    # --- Cabeceras de seguridad (valen para todo, incluida la API) ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Todo local: sin scripts, estilos ni medios de terceros. El JS y el CSS de las páginas van en línea; el único JS externo es /app/sw.js (worker).
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; worker-src 'self'; manifest-src 'self'" always;

    # --- Compresión ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json application/x-web-app-manifest+json;

    # Archivos ocultos (.git, .env...) nunca; el desafío de certbot vive en el server de HTTP.
    location ~ /\. { return 404; }

    # --- Servicio Node (127.0.0.1:3000) ---
    # Hilvapay manda a /api/hilvapay; la app a /api/app/...; el funnel a /api/lead y /api/click.
    location /api/ {
        if ($request_method !~ ^(GET|POST|PUT)$) { return 405; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El servicio confía en cf-connecting-ip si viene: acá se borra el que mande el cliente.
        # Si el dominio pasa por Cloudflare, ver deploy/README.md (módulo realip) para que $remote_addr sea la IP real.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_buffering on;
    }

    # Chequeo de que el servicio está vivo (para el monitoreo).
    location = /salud {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # --- App del comprador: /app/<acceso>/ (UUID v4 en minúsculas) ---
    # Misma página para cualquier acceso; el servicio decide si el acceso vale. Sin barra final: redirige a la ruta con barra.
    # Captura con nombre ($acceso): el `if` de abajo también es una regex y pisaría $1 con «GET».
    location ~ "^/app/(?<acceso>[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 /app/$acceso/;
    }
    location ~ "^/app/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /app/index.html =404;
        expires -1;
    }
    # El manifest de cada acceso es el mismo archivo que /app/manifest.webmanifest (su start_url "./" resuelve a la ruta personal).
    location ~ "^/app/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/manifest\.webmanifest$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        types { application/manifest+json webmanifest; }
        try_files /app/manifest.webmanifest =404;
        expires -1;
    }
    # Service worker y manifest: siempre revalidar, si no la app tarda en actualizarse.
    location = /app/sw.js {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires -1;
    }
    location = /app/manifest.webmanifest {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        types { application/manifest+json webmanifest; }
        expires -1;
    }
    location = /app/offline.html {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires -1;
    }
    # Capturas de la guía: los nombres no llevan hash, por eso solo una semana.
    location ^~ /app/capturas/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires 7d;
    }

    # --- Imágenes y videos ---
    # 30 días y SIN `immutable`: los nombres no llevan hash, así que si se reemplaza un archivo con el mismo nombre
    # la gente lo ve recién cuando vence el caché. Para cambiar una imagen ya publicada, conviene subirla con otro nombre.
    location ^~ /img/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires 30d;
    }
    location ^~ /media/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires 30d;
    }

    # --- Páginas (HTML, robots.txt): siempre revalidar ---
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
        expires -1;
    }
}
