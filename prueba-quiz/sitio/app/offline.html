<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#16A34A"><title>Sin conexión · BeastCamp</title>
<link rel="icon" href="/img/marca/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/marca/apple-touch-icon.png">
<style>:root{--g:#16A34A;--g2:#4ade80;--gd:#15803d;--t:#0b0f0c;--m:#5b665e;--line:#e5ebe6;--bg:#fff;--soft:#f4f7f5;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button{font:inherit;color:inherit}
/* progreso fijo arriba */
.prog{position:fixed;top:0;left:0;right:0;height:6px;background:#e5ebe6;z-index:30}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:0 6px 6px 0;transition:width .5s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 12px rgba(74,222,128,.6)}
/* estructura: en compu video a la izquierda; en celular franja arriba */
.shell{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100dvh}
.shell:not(.conbg){grid-template-rows:1fr}
#bg{position:relative;height:0;overflow:hidden;background:#dff3e6;transition:height .35s}
#bg video{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;filter:saturate(1.15) contrast(1.03)}
#bg:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,#fff)}
.shell.conbg #bg{height:clamp(72px,15dvh,150px);margin-top:0}
@media(max-width:899px){.shell.conbg main{justify-content:flex-start}}   /* celular con video arriba: el contenido arranca pegado al video, no centrado en el sobrante */
main{padding:10px 16px calc(var(--pie,64px) + 2px);width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
@media(min-width:900px){
 .shell{grid-template-rows:1fr}.shell.conbg{grid-template-columns:1fr 1fr}
 #bg{height:0;margin:0}.shell.conbg #bg{height:100dvh;position:sticky;top:0;margin-top:0}
 #bg video{object-position:50% 35%}
 #bg:after{left:auto;top:0;bottom:0;right:0;width:90px;height:auto;background:linear-gradient(90deg,transparent,#fff)}
 main{padding:14px 28px calc(var(--pie,64px) + 2px)}
 .shell:not(.conbg) main{max-width:560px}
}
/* ventanas altas: el video no se estira a toda la altura (se vería blando), queda en un recuadro de hasta 640 px, centrado */
@media(min-width:900px) and (min-height:701px){
 .shell.conbg #bg{height:min(100dvh,640px);top:0;align-self:start;margin-top:0;border-radius:0 0 var(--r) 0}
 .shell.conbg main{justify-content:flex-start}
 #bg:after{display:none}
}
/* pie legal fijo */
.ft{position:fixed;left:0;right:0;bottom:0;z-index:20;text-align:center;color:#5b665e;font-size:11px;line-height:1.35;padding:14px 16px max(8px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 45%);pointer-events:none}
.ft a{color:#5b665e;pointer-events:auto;display:inline-block;padding:8px 2px;margin:-8px -2px}
/* en las ofertas el pie va al final de la página, sin posición fija: la barra de abajo no lo tapa */
.ft.fin{position:static;background:none;pointer-events:auto;padding:18px 16px 24px}
/* textos */
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}h2{font-size:23px;line-height:1.2;margin:4px 0 6px;text-align:center}
p{margin:0 0 10px}.sub{text-align:center;color:var(--m);font-size:14px;margin:0 0 12px}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gd);font-weight:800;margin:0 0 6px}
.cen{text-align:center}
/* pill de prueba social / gatillos */
.pill{align-self:center;display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:700;color:var(--gd);background:#ecfdf3;border:1px solid #c8f1d6;border-radius:99px;padding:5px 12px;margin:4px 0 8px}
.pill svg{width:15px;height:15px;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill-c{display:flex;width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;justify-content:center;text-align:center}
.estr{color:#f5a623;letter-spacing:2px}
.gift{margin:12px 0 0;font-size:12.5px;background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:9px 12px;color:#854d0e;display:flex;gap:10px;align-items:center}
.gift svg{width:26px;height:26px;flex:none;stroke:#b45309;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.gift svg .a{stroke:#b45309}
/* globo de dato */
.globo{position:relative;background:#f0fdf4;border:1px solid #c8f1d6;color:#14532d;border-radius:14px;padding:9px 38px;font-size:13px;margin:0 0 12px;line-height:1.35;text-align:center}
.globo:before{content:"";position:absolute;left:12px;top:11px;width:16px;height:16px;border-radius:50%;background:var(--g)}
.globo:after{content:"i";position:absolute;left:12px;top:11px;width:16px;height:16px;color:#fff;font:800 11px/16px system-ui;text-align:center}
/* tarjetas de opciones */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(96px,19dvh,156px);transition:border-color .15s,box-shadow .15s,transform .15s;position:relative;overflow:hidden}
@media(hover:hover){.c:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,163,74,.15)}}
.c.on{border-color:var(--g);background:#f0fdf4;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.c b{font-size:13.5px;line-height:1.25;font-weight:700}.c small{display:block;font-size:12px;color:var(--m);font-weight:500;margin-top:2px}
.c svg{width:clamp(50px,11dvh,92px);height:clamp(50px,11dvh,92px);flex:none}
.c.A svg *{fill:none;stroke:#0b0f0c;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.c.A svg .a *,.c.A svg .a{stroke:var(--g)}

@keyframes bob{50%{transform:translateY(-3px)}}.c.B svg .fig{animation:bob 1.7s ease-in-out infinite;transform-origin:50% 100%}.c.B:nth-child(2) .fig{animation-delay:.2s}.c.B:nth-child(3) .fig{animation-delay:.4s}.c.B:nth-child(4) .fig{animation-delay:.6s}
.c.chico{min-height:clamp(80px,14.5dvh,118px);padding:6px 6px}.c.chico svg{width:clamp(42px,8.6dvh,72px);height:clamp(42px,8.6dvh,72px)}.c.chico b{font-size:12.5px}
.c .chk{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:6px;border:2px solid #cfd8d2;background:#fff}
.c.on .chk{background:var(--g);border-color:var(--g)}.c.on .chk:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
/* botones */
.cta{display:block;width:100%;border:0;border-radius:14px;background:linear-gradient(180deg,var(--g),var(--gd) 60%);color:#fff;font-weight:800;font-size:19px;line-height:1.25;padding:16px;margin-top:12px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(21,128,61,.3);position:relative;overflow:hidden}
/* el brillo solo se mueve con transform: no cuesta layout ni genera saltos de diseño */
.cta:after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-150%) skewX(-20deg);animation:brillo 3.2s infinite}
@keyframes brillo{0%{transform:translateX(-150%) skewX(-20deg)}60%,100%{transform:translateX(350%) skewX(-20deg)}}
.cta.s{background:#fff;color:var(--t);border:2px solid var(--line);box-shadow:none}.cta.s:after{display:none}.cta[disabled]{opacity:.45;box-shadow:none}
#pg:empty{display:none}
.box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px}
input[type=text],input[type=email]{width:100%;padding:15px;font-size:17px;border:2px solid #dfe6e1;border-radius:14px;margin-bottom:10px;font-family:inherit}
input:focus{border-color:var(--g)}
.errc{color:#b91c1c;font-size:13px;font-weight:600;margin:-4px 0 8px;text-align:center}.errc:empty{display:none}
:focus-visible{outline:3px solid #14773a;outline-offset:2px}.cta:focus-visible{outline-color:#0b0f0c}[tabindex="-1"]:focus{outline:0}
/* entrada de pantallas */
.scr{animation:entra .35s ease both}@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.sale{opacity:0;transform:translateX(-18px);transition:opacity .16s,transform .16s}
/* «Entrenar mal te frena» */
.ill{display:flex;gap:12px;align-items:center;margin:8px 0;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.ill .esc3d{width:84px;height:84px;object-fit:contain;mix-blend-mode:multiply;flex:none}.ill b{display:block;font-size:15px}.ill span{font-size:13px;color:var(--m)}
@keyframes sep{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}@keyframes sep2{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.esc .f1,.esc .p1{animation:sep 1.8s ease-in-out infinite}.esc .f2,.esc .p2{animation:sep2 1.8s ease-in-out infinite}
@keyframes sube{0%,100%{transform:translateY(7px)}45%{transform:translateY(-4px)}}.esc .guante-g{animation:sube 1.5s ease-in-out infinite}
@keyframes infla{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}.esc .pecho{animation:infla 2.4s ease-in-out infinite;transform-origin:48px 52px}
@keyframes exhala{0%{opacity:0;transform:translate(-8px,6px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-8px)}}.esc .aire circle{animation:exhala 2.4s ease-out infinite}.esc .aire circle:nth-child(2){animation-delay:.3s}.esc .aire circle:nth-child(3){animation-delay:.6s}
/* noticia */
.nota{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.07)}
.nota .im{height:120px;background:linear-gradient(135deg,#0b3d24,#16A34A 60%,#4ade80);display:flex;align-items:center;justify-content:center}
.nota .im img{width:100%;height:100%;object-fit:cover;display:block}.nota .im svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nota .tx{padding:12px 14px}.nota .et{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gd);font-weight:800}
.nota h3{margin:4px 0 6px;font-size:17px;line-height:1.25}.nota p{font-size:13px;color:var(--m);margin:0 0 6px}.nota .fu{font-size:11.5px;color:#5b665e}.nota a{color:var(--gd);display:inline-block;padding:10px 0;margin:-10px 0}
/* especialista */
.exp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.06)}
.av{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--g),#065f46);color:#fff;font-weight:800;font-size:25px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 3px var(--g2);overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.exp .nm{font-size:18px;font-weight:800}.exp .ti{color:var(--m);font-size:14px}.exp .mt{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;background:#fef9c3;color:#854d0e;border-radius:99px;padding:2px 9px}
.exp ul{list-style:none;margin:10px 0 0;padding:0;text-align:left;font-size:12.5px;color:var(--m)}.exp li{margin:5px 0;padding-left:16px;position:relative}.exp li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--m)}.chips span{border:1px solid var(--line);border-radius:99px;padding:5px 10px;background:#f9fbf9;display:inline-flex;gap:5px;align-items:center}
.chips svg{width:13px;height:13px;stroke:var(--g);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
/* carga */
.ring{position:relative;width:150px;height:150px;margin:6px auto 10px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.chkl{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:15px;color:#6b756e;transition:color .3s}.chkl .ic{width:22px;height:22px;border-radius:50%;border:2px solid #d4dcd7;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.chkl.d{color:var(--t)}.chkl.d .ic{background:var(--gd);border-color:var(--gd)}
.velo{position:fixed;inset:0;background:rgba(236,243,239,.78);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}@keyframes fade{from{opacity:0}}
.hoja{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:sube2 .3s}@keyframes sube2{from{transform:translateY(30px)}}
.hoja .tag{text-align:center}.hoja h3{text-align:center;margin:4px 0 12px;font-size:19px}
/* oferta */
.tbar{position:sticky;top:6px;z-index:5;margin:0 0 10px;box-shadow:0 -6px 0 #fff;background:#0b0f0c;color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;text-align:center}.tbar b{color:var(--g2);font-size:16px;font-variant-numeric:tabular-nums}
.vid{position:relative;border-radius:var(--r);overflow:hidden;background:#000;margin:8px 0}.vid video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.sello{display:flex;gap:12px;align-items:center}.sello svg{width:40px;height:40px;flex:none;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.vs{display:flex;gap:8px;margin-top:10px}.vs>div{flex:1;font-size:13px;line-height:1.7;color:var(--m);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.vs small{display:block;font-weight:800;letter-spacing:.08em;margin-bottom:4px;color:#b91c1c}.vs .on{border-color:var(--g);background:#f0fdf4;color:var(--t)}.vs .on small{color:var(--gd)}
.st{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}.st i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gd);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.sem{display:flex;gap:10px;margin:9px 0;font-size:14px}.sem b{flex:none;width:74px;color:var(--gd)}.sem span{color:var(--m)}
.stack>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.stack s{color:var(--m);white-space:nowrap}.stack .tot{font-weight:800;border-bottom:0}
.big{font-size:46px;font-weight:900;color:var(--g);line-height:1.1}.note{font-size:13px;color:var(--m);margin-top:4px}.badge{margin-top:10px;font-size:13px;font-weight:700;color:var(--gd)}
.garantia{display:flex;gap:12px;align-items:center;background:#f0fdf4;border:1px solid #c8f1d6;border-radius:var(--r);padding:14px;margin:12px 0}.garantia svg{width:44px;height:44px;flex:none;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.faq details[open]{padding-bottom:10px}.faq details{border-top:1px solid var(--line);padding:0;font-size:14px;color:var(--m)}.faq summary{font-weight:700;color:var(--t);cursor:pointer;font-size:15px;padding:12px 0}
.test2{display:flex;gap:10px;align-items:center;margin-top:10px}.test2 .av{background:linear-gradient(135deg,var(--gd),#065f46)}.test2 span{color:var(--m);font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));box-shadow:0 -6px 20px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center;justify-content:center}
.sticky span{font-size:12px;color:var(--m);flex:none;line-height:1.3}.sticky b{display:block;color:var(--gd);font-size:16px}.sticky .cta{margin:0;flex:0 1 360px}
@media(min-width:520px){.sticky{padding-left:calc(50% - 244px);padding-right:calc(50% - 244px)}}
@media(min-width:900px){.sticky{padding-left:calc(50% - 252px);padding-right:calc(50% - 252px)}}
.oferta-main{padding-bottom:140px}.oferta-main .scr{animation:none}
.legal{max-width:680px;margin:0 auto;padding:22px 18px 80px;font-size:15px}.legal h1{font-size:26px}.legal h2{text-align:left;font-size:18px;margin-top:22px}.legal a{color:var(--gd)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* pantallas bajas (celulares chicos): todo entra sin scroll */

@media(max-height:700px){
 h2{font-size:21px;margin:2px 0 4px}.sub{margin-bottom:8px}.pill{margin:2px 0 6px}.gift{margin-top:8px;padding:7px 10px}.globo{margin-bottom:8px;padding-top:7px;padding-bottom:7px}
 .nota .im{height:60px}.nota .im svg{width:34px;height:34px}.nota .cu{display:none}.nota h3{font-size:16px}
 .ill{margin:5px 0;padding:4px 10px}.ill .esc{width:74px;height:74px}
 .experto .exp ul,.experto .exp p{display:none}.experto .av{width:58px;height:58px;font-size:19px}.experto .exp{padding:10px}.experto .chips{margin-top:8px}
 .perfil .tag{display:none}.perfil .box{padding:7px 12px;margin:5px 0}.perfil .sem{margin:2px 0;font-size:12.5px}.perfil h2{font-size:19px}.perfil .cta{margin-top:8px;padding:12px}
 .cta{padding:13px;margin-top:8px}.mail input{margin-bottom:7px}
}
@media(max-height:560px){.c b{font-size:12px}.c small{font-size:10.5px}.globo{display:none}.gift{display:none}}
/* compu: las tarjetas y los muñecos crecen con la altura de la ventana (no hay franja de video arriba) */
@media(min-width:900px){
 .c{min-height:clamp(110px,24dvh,205px)}.c svg{width:clamp(56px,14dvh,128px);height:clamp(56px,14dvh,128px)}
 .c.chico{min-height:clamp(88px,15.5dvh,140px)}.c.chico svg{width:clamp(46px,9.6dvh,84px);height:clamp(46px,9.6dvh,84px)}
 .c b{font-size:clamp(13px,2.2dvh,16px)}
 h2{font-size:clamp(22px,4.2dvh,30px)}
}
@media(min-width:900px) and (max-height:700px){.c{min-height:clamp(100px,21dvh,160px)}.c svg{width:clamp(54px,12.5dvh,100px);height:clamp(54px,12.5dvh,100px)}}
.perfil .box span{font-size:14.5px}
@media(min-width:900px){
 .velo{align-items:center}.hoja{border-radius:22px;max-width:460px;animation:fade .25s}
 .c.chico{flex-direction:row;justify-content:flex-start;gap:12px;padding:6px 14px;text-align:left}
 .c.chico svg{width:clamp(62px,12.5dvh,104px);height:clamp(62px,12.5dvh,104px)}
 .c.chico b{font-size:clamp(13px,2.3dvh,16px)}
}

/* muñecos 3D generados (por ahora 3 opciones de prueba) */
.c img.im3d{width:clamp(50px,11.4dvh,92px);height:clamp(50px,11.4dvh,92px);object-fit:contain;mix-blend-mode:multiply;flex:none}
@media(min-width:900px){.c img.im3d{width:clamp(64px,17dvh,150px);height:clamp(64px,17dvh,150px)}}
@media(min-width:900px) and (max-height:700px){.c img.im3d{width:clamp(60px,15dvh,110px);height:clamp(60px,15dvh,110px)}}

/* movimiento de las escenas 3D */
@keyframes tambalea{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.e-pies{animation:tambalea 2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sube3{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}.e-guardia{animation:sube3 1.6s ease-in-out infinite}
@keyframes infla3{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}.e-resp{animation:infla3 2.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob3{50%{transform:translateY(-3px)}}.c img.im3d{animation:bob3 2.2s ease-in-out infinite}.c:nth-child(2) img.im3d{animation-delay:.25s}.c:nth-child(3) img.im3d{animation-delay:.5s}.c:nth-child(4) img.im3d{animation-delay:.75s}
@media(max-height:700px){.ill .esc3d{width:68px;height:68px}}
.shell:not(.conbg) #bg{display:none}

/* muñecos 3D: figura vertical a la izquierda y texto a la derecha, para que se vean grandes sin scroll */
.c:has(img.im3d){flex-direction:row;justify-content:flex-start;gap:6px;padding:4px 8px 4px 4px;text-align:left}
.c:has(img.im3d) b{flex:1;min-width:0}
.c img.im3d{height:clamp(84px,17dvh,150px);width:auto;max-width:48%;aspect-ratio:3/4;object-fit:contain;mix-blend-mode:multiply;flex:none}
@media(max-width:380px){.c:has(img.im3d){padding-right:12px}.c img.im3d{max-width:44%}}   /* celulares angostos: el texto no toca el borde de la tarjeta */
.c.chico:has(img.im3d){padding:2px 8px 2px 2px}.c.chico img.im3d{height:clamp(62px,12.4dvh,112px)}
@media(min-width:900px){.c:has(img.im3d){padding:6px 14px 6px 8px;gap:12px}.c img.im3d{height:clamp(100px,22dvh,190px)}.c.chico img.im3d{height:clamp(78px,15.5dvh,140px)}}
@media(min-width:900px) and (max-height:700px){.c img.im3d{height:clamp(92px,20dvh,150px)}.c.chico img.im3d{height:clamp(70px,14.5dvh,110px)}}

.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:#0b0f0c;color:#fff;padding:11px 18px;border-radius:30px;font-weight:700;font-size:14.5px;opacity:0;transition:opacity .3s,transform .3s;z-index:90;box-shadow:0 8px 30px #0003;max-width:90vw;text-align:center}.toast.in{opacity:1;transform:translate(-50%,0)}
/* en el quiz el aviso va abajo, sobre el pie legal, para no tapar el título (la app usa .toast sin .abajo) */
.toast.abajo{top:auto;bottom:calc(var(--pie,64px) + 12px);transform:translate(-50%,20px)}.toast.abajo.in{transform:translate(-50%,0)}
.tbar.up{text-transform:uppercase;letter-spacing:.03em;font-size:12.5px;background:#7f1d1d}.tbar.up b{color:#fff}
.gracias{text-align:center;padding-top:8px}.gracias .tick{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1fbf5b,#15803d);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 10px 26px rgba(22,163,74,.35)}.gracias .tick svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.precio2{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-top:6px}
/* barra de progreso del quiz: tarjeta redondeada y centrada, justo debajo del video (o arriba de todo si no hay video). Solo en las páginas con .shell: la app usa su propia .prog */
body:has(#shell) .prog{top:12px;left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;height:10px;border-radius:99px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,28,.12);transition:top .35s}
body:has(#shell) .prog i{border-radius:99px;box-shadow:none}
body:has(#shell) main{padding-top:34px}
body:has(#shell.conbg) .prog{top:calc(clamp(72px,15dvh,150px) + 6px)}
body:has(#shell.conbg) main{padding-top:36px}
@media(min-width:900px){
 body:has(#shell) .prog{top:14px;width:min(calc(100% - 56px),520px)}
 body:has(#shell) main{padding-top:32px}
 body:has(#shell.conbg) .prog{top:14px;left:75%;width:min(calc(50% - 56px),464px)}
 body:has(#shell.conbg) main{padding-top:32px}
}
/* Tarjeta grande del especialista (funnel de bajar de peso) */
.med{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px 16px 16px;text-align:center;box-shadow:0 14px 34px rgba(11,15,12,.08);display:flex;flex-direction:column;align-items:center;animation:medSube .6s cubic-bezier(.3,.8,.3,1) both}
.med-foto{position:relative;width:96px;height:96px;margin-bottom:12px}
.med-aro{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#4ade80,#15803d,#bbf7d0,#4ade80);animation:medGira 5s linear infinite}
.med-foto img,.med-foto>i{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;background:linear-gradient(135deg,var(--g),#065f46);color:#fff;font:800 28px/1 system-ui;font-style:normal}
.med-mn{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:800;background:#fef9c3;color:#854d0e;border:2px solid #fff;border-radius:99px;padding:2px 9px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.med-nm{font-size:19px;font-weight:800;margin-top:4px}.med-ti{font-size:14px;color:var(--m)}
.med-l{list-style:none;margin:12px 0 0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;align-self:stretch}
.med-l li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.38;color:#3c4540;animation:medEntra .5s cubic-bezier(.3,.8,.3,1) calc(.35s + var(--i) * .14s) both}
.med-l svg{flex:none;width:30px;height:30px;padding:6px;border-radius:10px;background:#ecfdf3;fill:none;stroke:var(--gd);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.med-chip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;font-weight:700;color:#854d0e;background:#fffbe6;border:1px solid #fde68a;border-radius:99px;padding:5px 12px;animation:medSube .5s ease .9s both}
.med-chip .estr{letter-spacing:0}
@keyframes medGira{to{transform:rotate(360deg)}}
@keyframes medSube{from{opacity:0;transform:translateY(14px)}}
@keyframes medEntra{from{opacity:0;transform:translateX(12px)}}
.scr.experto .med{margin:auto 0}
@media(max-height:700px){.med{padding:12px 12px 10px}.med-foto{width:66px;height:66px;margin-bottom:10px}.med-nm{font-size:17px}.med-l{margin-top:8px;gap:5px}.med-l li{font-size:12px;line-height:1.3}.med-l svg{width:24px;height:24px;padding:4px}.med-chip{margin-top:8px}}
@media(max-height:640px){.med-ti{display:none}.med-l li{font-size:11.5px}.med-l li.res{display:none}}

/* Estilos propios de la app del comprador. base.css va primero (sin tocarlo) y de ahí salen la paleta, las tarjetas (.c, .box), el botón (.cta),
   las etiquetas (.tag, .chips), la barra de progreso (.prog), el aviso (.toast) y la hoja inferior (.velo/.hoja). Acá va solo lo que la app necesita además. */
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--nav-h:64px;--amb:#fffbe6;--amb-b:#fde68a;--amb-t:#854d0e}
body{overscroll-behavior-y:none;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1:focus,h1:focus-visible{outline:none}
a{color:var(--gd)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
img.im3d{object-fit:contain;mix-blend-mode:multiply;display:block;height:auto;max-width:100%}

/* estructura: una columna centrada, con lugar para la barra inferior y el notch */
main.ap{display:block;width:100%;max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(14px + var(--safe-t)) max(16px,env(safe-area-inset-right)) calc(var(--nav-h) + var(--safe-b) + 28px) max(16px,env(safe-area-inset-left))}
.pg{animation:entra .35s ease both}
.pg.tab{animation:subeFade .3s ease both}
@keyframes subeFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ap h1{font-size:28px;line-height:1.15;margin:4px 0 6px}
.ap h2{text-align:left;font-size:19px;line-height:1.25;margin:24px 0 10px}
.sub.l{text-align:left;margin:0}
.sm{font-size:14px;color:var(--m);margin:0 0 10px}
.err{color:#b91c1c;font-size:13.5px;font-weight:600;margin:-4px 0 8px}.err:empty{display:none}
.ap button{cursor:pointer}
.bt{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;background:transparent;border-radius:14px;padding:0;color:var(--t);transition:background .15s,transform .12s}
.bt:hover{background:var(--soft)}.bt:active{transform:scale(.92)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:transform .12s,box-shadow .15s}
.cta:active{transform:scale(.98)}
.cta.s{background:#fff;color:var(--t)}
.cta.chico{display:inline-flex;width:auto;min-height:44px;padding:10px 18px;font-size:15px;margin-top:8px}
.c{font:inherit}.c:active{transform:scale(.98)}
.c b{font-size:15px}
.c.on{box-shadow:0 0 0 3px rgba(74,222,128,.3)}
.tag{color:var(--gd)}
.chips{margin-top:8px}.chips span{color:#4a554d}

/* avisos fijos (el aviso breve va abajo, arriba de la barra de navegación: nunca tapa títulos) */
#aviso{position:sticky;top:0;z-index:55}
.aviso{display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(6px + var(--safe-t)) 12px 6px;font-size:13.5px;font-weight:700;min-height:44px}
.aviso .ic{width:18px;height:18px}
.aviso.sin{background:#0b0f0c;color:#fff}.aviso.upd{background:var(--gd);color:#fff}
.bt-aviso{min-height:44px;min-width:44px;padding:0 16px;border-radius:99px;border:2px solid #fff;background:transparent;color:#fff;font-weight:800}
.toast{top:auto;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);transform:translate(-50%,20px)}.toast.in{transform:translate(-50%,0)}
.hoja{padding-bottom:calc(26px + var(--safe-b))}.hoja .cta{margin-top:10px}.hoja .sub{text-align:center}
.hoja .niveles{margin-bottom:6px}
body.jugando #aviso{display:none}

main.ap.sinnav{padding-bottom:calc(var(--safe-b) + 16px)}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) var(--safe-b) env(safe-area-inset-left)}
.nav[hidden]{display:none}
.nav a{flex:1;max-width:150px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#4a554d;font-size:12px;font-weight:700;position:relative;transition:color .15s}
.nav a .ic{width:24px;height:24px;transition:transform .2s}
.nav a[aria-current=page]{color:var(--gd)}.nav a[aria-current=page] .ic{transform:translateY(-2px);stroke-width:2.8}
.nav a[aria-current=page]:before{content:"";position:absolute;top:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--g)}
.nav a:active .ic{transform:scale(.88)}

/* encabezados */
.top{display:flex;align-items:center;gap:6px;margin:-6px 0 4px -10px}.top .tag{margin:0}
.saludo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 14px}
.saludo>div{min-width:0}
.rach{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;color:#4a554d;text-decoration:none;flex:none;transition:transform .12s}
.rach:active{transform:scale(.95)}
.rach b{font-size:17px}
.rach.on{background:var(--amb);border-color:var(--amb-b);color:var(--amb-t)}.rach.on .ic{stroke:#b45309;fill:#fde68a}
.perf-im,.perf-im img{width:52px;height:70px}.perf-im{flex:none}

/* tira de la semana */
.sem7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;list-style:none;margin:0 0 14px;padding:0}
.dd{display:flex;flex-direction:column;align-items:center;gap:4px}
.dd i{font-style:normal;font-size:11.5px;font-weight:700;color:#4a554d}
.dd b{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#4a554d;background:#fff}
.dd b .ic{width:18px;height:18px;stroke-width:3.2}
.dd.ok b{background:var(--gd);border-color:var(--gd);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.dd.hoy b{border-color:var(--g);color:var(--gd);box-shadow:0 0 0 3px rgba(74,222,128,.3)}.dd.hoy.ok b{color:#fff}
.dd.fut b{opacity:.55}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* tarjeta grande «Tu sesión de hoy» */
.hero{background:linear-gradient(160deg,#f0fdf4 0%,#e3f8ea 100%);border:2px solid var(--g2);border-radius:20px;padding:14px;box-shadow:0 10px 26px rgba(22,163,74,.14);margin:0 0 14px}
.hero-t{display:flex;gap:10px;align-items:center}
.hero-im{flex:none;width:33%;max-width:128px}
.hero-im img{width:100%;aspect-ratio:3/4;animation:bob3 2.4s ease-in-out infinite}
.hero-x{min-width:0;flex:1}
.ap .hero h2{margin:2px 0 4px;font-size:20px}
.hero .sm{margin:0}.hero .chips{justify-content:flex-start}
.hero .cta{margin-top:12px}
.hero.curso{border-color:var(--amb-b);background:linear-gradient(160deg,#fffdf0,#fff6cc)}.hero.curso .tag{color:var(--amb-t)}

.bar{height:10px;background:#e5ebe6;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .9s cubic-bezier(.3,.8,.3,1)}
.box.semana{margin:0 0 4px}

/* filas de lista */
.lista{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;align-items:center;gap:12px;min-height:72px;width:100%;padding:8px 12px 8px 8px;background:#fff;border:2px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--t);text-align:left;font:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.fila:hover{border-color:var(--g);transform:translateY(-1px);box-shadow:0 8px 18px rgba(22,163,74,.12)}.fila:active{transform:scale(.99)}
.fila-im{flex:none;width:52px;height:68px;display:flex;align-items:center;justify-content:center}
.fila-im img{height:100%;width:auto}
.fila-x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fila-x b{font-size:15.5px;line-height:1.25}.fila-x small{font-size:13px;color:var(--m);line-height:1.3}
.chev{color:#7a857d;width:20px;height:20px}
.ic-f{width:30px;height:30px;stroke:var(--gd)}

/* plan */
.nivel-actual{display:flex;align-items:center;gap:12px}
.na-im{width:50px;height:66px;flex:none}.na-im img{height:100%;width:auto}
.na-x{flex:1;min-width:0}.na-x .tag{margin:0}.na-x b{display:block;font-size:19px}.na-x small{color:var(--m);font-size:13px}
.nivel-actual .cta.chico{margin:0;flex:none}
.sem-c{border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;background:#fff}
.sem-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sem-h .tag{margin:0 0 2px}.ap .sem-h h2{margin:0 0 4px;font-size:17px}
.mini-anillo{width:48px;height:48px;flex:none}
.mini-anillo .pista{fill:none;stroke:#e5ebe6;stroke-width:5}
.mini-anillo .aro{fill:none;stroke:var(--g);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.mini-anillo text{font:800 11px system-ui;fill:var(--t)}
.ses{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ses-a{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:14px;background:var(--soft);border:2px solid transparent;text-decoration:none;color:var(--t);transition:transform .12s,border-color .15s}
.ses-a:active{transform:scale(.985)}
.ses-a.sig{background:#f0fdf4;border-color:var(--g)}.ses-a.hecha{background:#fff;border-color:var(--line)}
.est{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #b5c0b8;display:flex;align-items:center;justify-content:center;background:#fff}
.est .ic{width:14px;height:14px;stroke-width:3.2}
.hecha .est{background:var(--gd);border-color:var(--gd);color:#fff}.sig .est{border-color:var(--g);color:var(--gd)}
.ses-x{flex:1;min-width:0}.ses-x b{font-size:14.5px;line-height:1.25;display:block}.ses-x small{font-size:12.5px;color:var(--m);display:block}
.est-t{font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#4a554d;flex:none}.est-t.ok,.est-t.sig{color:var(--gd)}

/* resumen de sesión */
.res-im{display:flex;justify-content:center;background:linear-gradient(160deg,#f0fdf4,#e3f8ea);border-radius:20px;margin:4px 0 12px;padding:8px}
.res-im img{height:min(25dvh,220px);width:auto;animation:bob3 2.4s ease-in-out infinite}
.obj{color:var(--m);margin:10px 0}.resumen-s .chips{justify-content:flex-start}
.bloques{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.bloques li{display:flex;gap:10px;align-items:flex-start}
.bloques i,.pasos i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gd);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.bloques b{display:block;font-size:15px}.bloques small{display:block;color:var(--m);font-size:13px}
.cta-fija{position:sticky;bottom:0;z-index:5;padding:14px 0 calc(8px + var(--safe-b));margin-top:8px;background:linear-gradient(transparent,#fff 30%)}
.cta-fija .cta{margin-top:8px}.cta-fija .cta:first-child{margin-top:0}
.ok-box{display:flex;gap:10px;align-items:center;background:#f0fdf4;border-color:#c8f1d6}
.ok-box .ic{stroke:var(--gd);width:26px}.ok-box small{display:block;color:var(--m);font-size:13px}
.aviso-box{background:var(--amb);border-color:var(--amb-b)}.aviso-box .sm{color:var(--amb-t)}
.pasos{list-style:none;margin:10px 0 0;padding:0}
.pasos li{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14.5px}
.ic.inl{display:inline-block;vertical-align:-5px;width:20px;height:20px;stroke:var(--gd);margin:0 2px}

/* guía */
.gcard{margin:0 0 26px}.ap .gcard h2{margin-top:14px}
.zona.sinvideo{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f0fdf4,#e3f8ea);border-radius:20px;aspect-ratio:16/10;position:relative;overflow:hidden}
.zona.sinvideo img.im3d{height:92%;width:auto;animation:bob3 2.4s ease-in-out infinite}
.zona.convideo{border-radius:20px;overflow:hidden;background:#0b0f0c;aspect-ratio:16/10}
.zona video,.zona .zv{width:100%;height:100%;object-fit:cover;display:block}
.zona-et{position:absolute;left:10px;top:10px;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--gd);background:#fff;border:1px solid #c8f1d6;border-radius:99px;padding:4px 10px}
.zona-et .ic{width:14px;height:14px}
.checks{list-style:none;padding:0;margin:8px 0}
.checks li{display:flex;gap:10px;margin:9px 0;font-size:14.5px}.checks .ic{stroke:var(--gd);width:20px;height:20px;margin-top:1px}

/* progreso */
.racha-g{display:flex;gap:12px;align-items:center;margin-top:0}
.rg-im{width:62px;height:82px;flex:none}.rg-im img{height:100%;width:auto}
.racha-g .tag{margin:0}.rg-n{font-size:15px}.rg-n b{font-size:40px;line-height:1;font-weight:900;color:var(--gd)}.racha-g small{color:var(--m);font-size:13px;display:block}
.racha-g.on{background:var(--amb);border-color:var(--amb-b)}.racha-g.on .rg-n b,.racha-g.on .tag{color:var(--amb-t)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:2px solid var(--line);border-radius:var(--r);text-align:center;padding:12px 6px}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--gd);line-height:1.1}.stat small{font-size:12.5px;color:var(--m)}
