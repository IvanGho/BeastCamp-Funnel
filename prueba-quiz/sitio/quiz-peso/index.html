*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button{font:inherit;color:inherit}
/* progreso fijo arriba */
.prog{position:fixed;top:0;left:0;right:0;height:6px;background:#e5ebe6;z-index:30}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:0 6px 6px 0;transition:width .5s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 12px rgba(74,222,128,.6)}
/* estructura: en compu video a la izquierda; en celular franja arriba */
.shell{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100dvh}
.shell:not(.conbg){grid-template-rows:1fr}
#bg{position:relative;height:0;overflow:hidden;background:#dff3e6;transition:height .35s}
#bg video{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;filter:saturate(1.15) contrast(1.03)}
#bg:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,#fff)}
.shell.conbg #bg{height:clamp(72px,15dvh,150px);margin-top:0}
@media(max-width:99999px){.shell.conbg main{justify-content:flex-start}}   /* celular con video arriba: el contenido arranca pegado al video, no centrado en el sobrante */
main{padding:10px 16px calc(var(--pie,64px) + 2px);width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
@media(min-width:99999px){
 .shell{grid-template-rows:1fr}.shell.conbg{grid-template-columns:1fr 1fr}
 #bg{height:0;margin:0}.shell.conbg #bg{height:100dvh;position:sticky;top:0;margin-top:0}
 #bg video{object-position:50% 35%}
 #bg:after{left:auto;top:0;bottom:0;right:0;width:90px;height:auto;background:linear-gradient(90deg,transparent,#fff)}
 main{padding:14px 28px calc(var(--pie,64px) + 2px)}
 .shell:not(.conbg) main{max-width:560px}
}
/* ventanas altas: el video no se estira a toda la altura (se vería blando), queda en un recuadro de hasta 640 px, centrado */
@media(min-width:99999px) and (min-height:701px){
 .shell.conbg #bg{height:min(100dvh,640px);top:0;align-self:start;margin-top:0;border-radius:0 0 var(--r) 0}
 .shell.conbg main{justify-content:flex-start}
 #bg:after{display:none}
}
/* pie legal fijo */
.ft{position:fixed;left:0;right:0;bottom:0;z-index:20;text-align:center;color:#5b665e;font-size:11px;line-height:1.35;padding:14px 16px max(8px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 45%);pointer-events:none}
.ft a{color:#5b665e;pointer-events:auto;display:inline-block;padding:8px 2px;margin:-8px -2px}
/* en las ofertas el pie va al final de la página, sin posición fija: la barra de abajo no lo tapa */
.ft.fin{position:static;background:none;pointer-events:auto;padding:18px 16px 24px}
/* textos */
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}h2{font-size:23px;line-height:1.2;margin:4px 0 6px;text-align:center}
p{margin:0 0 10px}.sub{text-align:center;color:var(--m);font-size:14px;margin:0 0 12px}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gd);font-weight:800;margin:0 0 6px}
.cen{text-align:center}
/* pill de prueba social / gatillos */
.pill{align-self:center;display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:700;color:var(--gd);background:#ecfdf3;border:1px solid #c8f1d6;border-radius:99px;padding:5px 12px;margin:4px 0 8px}
.pill svg{width:15px;height:15px;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill-c{display:flex;width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;justify-content:center;text-align:center}
.estr{color:#f5a623;letter-spacing:2px}
.gift{margin:12px 0 0;font-size:12.5px;background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:9px 12px;color:#854d0e;display:flex;gap:10px;align-items:center}
.gift svg{width:26px;height:26px;flex:none;stroke:#b45309;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.gift svg .a{stroke:#b45309}
/* globo de dato */
.globo{position:relative;background:#f0fdf4;border:1px solid #c8f1d6;color:#14532d;border-radius:14px;padding:9px 38px;font-size:13px;margin:0 0 12px;line-height:1.35;text-align:center}
.globo:before{content:"";position:absolute;left:12px;top:11px;width:16px;height:16px;border-radius:50%;background:var(--g)}
.globo:after{content:"i";position:absolute;left:12px;top:11px;width:16px;height:16px;color:#fff;font:800 11px/16px system-ui;text-align:center}
/* tarjetas de opciones */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(96px,19dvh,156px);transition:border-color .15s,box-shadow .15s,transform .15s;position:relative;overflow:hidden}
@media(hover:hover){.c:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,163,74,.15)}}
.c.on{border-color:var(--g);background:#f0fdf4;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.c b{font-size:13.5px;line-height:1.25;font-weight:700}.c small{display:block;font-size:12px;color:var(--m);font-weight:500;margin-top:2px}
.c svg{width:clamp(50px,11dvh,92px);height:clamp(50px,11dvh,92px);flex:none}
.c.A svg *{fill:none;stroke:#0b0f0c;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.c.A svg .a *,.c.A svg .a{stroke:var(--g)}

@keyframes bob{50%{transform:translateY(-3px)}}.c.B svg .fig{animation:bob 1.7s ease-in-out infinite;transform-origin:50% 100%}.c.B:nth-child(2) .fig{animation-delay:.2s}.c.B:nth-child(3) .fig{animation-delay:.4s}.c.B:nth-child(4) .fig{animation-delay:.6s}
.c.chico{min-height:clamp(80px,14.5dvh,118px);padding:6px 6px}.c.chico svg{width:clamp(42px,8.6dvh,72px);height:clamp(42px,8.6dvh,72px)}.c.chico b{font-size:12.5px}
.c .chk{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:6px;border:2px solid #cfd8d2;background:#fff}
.c.on .chk{background:var(--g);border-color:var(--g)}.c.on .chk:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
/* botones */
.cta{display:block;width:100%;border:0;border-radius:14px;background:linear-gradient(180deg,var(--g),var(--gd) 60%);color:#fff;font-weight:800;font-size:19px;line-height:1.25;padding:16px;margin-top:12px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(21,128,61,.3);position:relative;overflow:hidden}
/* el brillo solo se mueve con transform: no cuesta layout ni genera saltos de diseño */
.cta:after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-150%) skewX(-20deg);animation:brillo 3.2s infinite}
@keyframes brillo{0%{transform:translateX(-150%) skewX(-20deg)}60%,100%{transform:translateX(350%) skewX(-20deg)}}
.cta.s{background:#fff;color:var(--t);border:2px solid var(--line);box-shadow:none}.cta.s:after{display:none}.cta[disabled]{opacity:.45;box-shadow:none}
#pg:empty{display:none}
.box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px}
input[type=text],input[type=email]{width:100%;padding:15px;font-size:17px;border:2px solid #dfe6e1;border-radius:14px;margin-bottom:10px;font-family:inherit}
input:focus{border-color:var(--g)}
.errc{color:#b91c1c;font-size:13px;font-weight:600;margin:-4px 0 8px;text-align:center}.errc:empty{display:none}
:focus-visible{outline:3px solid #14773a;outline-offset:2px}.cta:focus-visible{outline-color:#0b0f0c}[tabindex="-1"]:focus{outline:0}
/* entrada de pantallas */
.scr{animation:entra .35s ease both}@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.sale{opacity:0;transform:translateX(-18px);transition:opacity .16s,transform .16s}
/* «Entrenar mal te frena» */
.ill{display:flex;gap:12px;align-items:center;margin:8px 0;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.ill .esc3d{width:84px;height:84px;object-fit:contain;mix-blend-mode:multiply;flex:none}.ill b{display:block;font-size:15px}.ill span{font-size:13px;color:var(--m)}
@keyframes sep{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}@keyframes sep2{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.esc .f1,.esc .p1{animation:sep 1.8s ease-in-out infinite}.esc .f2,.esc .p2{animation:sep2 1.8s ease-in-out infinite}
@keyframes sube{0%,100%{transform:translateY(7px)}45%{transform:translateY(-4px)}}.esc .guante-g{animation:sube 1.5s ease-in-out infinite}
@keyframes infla{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}.esc .pecho{animation:infla 2.4s ease-in-out infinite;transform-origin:48px 52px}
@keyframes exhala{0%{opacity:0;transform:translate(-8px,6px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-8px)}}.esc .aire circle{animation:exhala 2.4s ease-out infinite}.esc .aire circle:nth-child(2){animation-delay:.3s}.esc .aire circle:nth-child(3){animation-delay:.6s}
/* noticia */
.nota{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.07)}
.nota .im{height:120px;background:linear-gradient(135deg,#0b3d24,#16A34A 60%,#4ade80);display:flex;align-items:center;justify-content:center}
.nota .im img{width:100%;height:100%;object-fit:cover;display:block}.nota .im svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nota .tx{padding:12px 14px}.nota .et{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gd);font-weight:800}
.nota h3{margin:4px 0 6px;font-size:17px;line-height:1.25}.nota p{font-size:13px;color:var(--m);margin:0 0 6px}.nota .fu{font-size:11.5px;color:#5b665e}.nota a{color:var(--gd);display:inline-block;padding:10px 0;margin:-10px 0}
/* especialista */
.exp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.06)}
.av{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--g),#065f46);color:#fff;font-weight:800;font-size:25px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 3px var(--g2);overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.exp .nm{font-size:18px;font-weight:800}.exp .ti{color:var(--m);font-size:14px}.exp .mt{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;background:#fef9c3;color:#854d0e;border-radius:99px;padding:2px 9px}
.exp ul{list-style:none;margin:10px 0 0;padding:0;text-align:left;font-size:12.5px;color:var(--m)}.exp li{margin:5px 0;padding-left:16px;position:relative}.exp li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--m)}.chips span{border:1px solid var(--line);border-radius:99px;padding:5px 10px;background:#f9fbf9;display:inline-flex;gap:5px;align-items:center}
.chips svg{width:13px;height:13px;stroke:var(--g);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
/* carga */
.ring{position:relative;width:150px;height:150px;margin:6px auto 10px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.chkl{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:15px;color:#6b756e;transition:color .3s}.chkl .ic{width:22px;height:22px;border-radius:50%;border:2px solid #d4dcd7;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.chkl.d{color:var(--t)}.chkl.d .ic{background:var(--gd);border-color:var(--gd)}
.velo{position:fixed;inset:0;background:rgba(236,243,239,.78);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}@keyframes fade{from{opacity:0}}
.hoja{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:sube2 .3s}@keyframes sube2{from{transform:translateY(30px)}}
.hoja .tag{text-align:center}.hoja h3{text-align:center;margin:4px 0 12px;font-size:19px}
/* oferta */
.tbar{position:sticky;top:6px;z-index:5;margin:0 0 10px;box-shadow:0 -6px 0 #fff;background:#0b0f0c;color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;text-align:center}.tbar b{color:var(--g2);font-size:16px;font-variant-numeric:tabular-nums}
.vid{position:relative;border-radius:var(--r);overflow:hidden;background:#000;margin:8px 0}.vid video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.sello{display:flex;gap:12px;align-items:center}.sello svg{width:40px;height:40px;flex:none;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.vs{display:flex;gap:8px;margin-top:10px}.vs>div{flex:1;font-size:13px;line-height:1.7;color:var(--m);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.vs small{display:block;font-weight:800;letter-spacing:.08em;margin-bottom:4px;color:#b91c1c}.vs .on{border-color:var(--g);background:#f0fdf4;color:var(--t)}.vs .on small{color:var(--gd)}
.st{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}.st i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gd);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.sem{display:flex;gap:10px;margin:9px 0;font-size:14px}.sem b{flex:none;width:74px;color:var(--gd)}.sem span{color:var(--m)}
.stack>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.stack s{color:var(--m);white-space:nowrap}.stack .tot{font-weight:800;border-bottom:0}
.big{font-size:46px;font-weight:900;color:var(--g);line-height:1.1}.note{font-size:13px;color:var(--m);margin-top:4px}.badge{margin-top:10px;font-size:13px;font-weight:700;color:var(--gd)}
.garantia{display:flex;gap:12px;align-items:center;background:#f0fdf4;border:1px solid #c8f1d6;border-radius:var(--r);padding:14px;margin:12px 0}.garantia svg{width:44px;height:44px;flex:none;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.faq details[open]{padding-bottom:10px}.faq details{border-top:1px solid var(--line);padding:0;font-size:14px;color:var(--m)}.faq summary{font-weight:700;color:var(--t);cursor:pointer;font-size:15px;padding:12px 0}
.test2{display:flex;gap:10px;align-items:center;margin-top:10px}.test2 .av{background:linear-gradient(135deg,var(--gd),#065f46)}.test2 span{color:var(--m);font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));box-shadow:0 -6px 20px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center;justify-content:center}
.sticky span{font-size:12px;color:var(--m);flex:none;line-height:1.3}.sticky b{display:block;color:var(--gd);font-size:16px}.sticky .cta{margin:0;flex:0 1 360px}
@media(min-width:520px){.sticky{padding-left:calc(50% - 244px);padding-right:calc(50% - 244px)}}
@media(min-width:99999px){.sticky{padding-left:calc(50% - 252px);padding-right:calc(50% - 252px)}}
.oferta-main{padding-bottom:140px}.oferta-main .scr{animation:none}
.legal{max-width:680px;margin:0 auto;padding:22px 18px 80px;font-size:15px}.legal h1{font-size:26px}.legal h2{text-align:left;font-size:18px;margin-top:22px}.legal a{color:var(--gd)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media(max-height:700px){
 h2{font-size:21px;margin:2px 0 4px}.sub{margin-bottom:8px}.pill{margin:2px 0 6px}.gift{margin-top:8px;padding:7px 10px}.globo{margin-bottom:8px;padding-top:7px;padding-bottom:7px}

@media(min-width:99999px){
 .c{min-height:clamp(110px,24dvh,205px)}.c svg{width:clamp(56px,14dvh,128px);height:clamp(56px,14dvh,128px)}

/* muñecos 3D generados (por ahora 3 opciones de prueba) */
.c img.im3d{width:clamp(50px,11.4dvh,92px);height:clamp(50px,11.4dvh,92px);object-fit:contain;mix-blend-mode:multiply;flex:none}
@media(min-width:99999px){.c img.im3d{width:clamp(64px,17dvh,150px);height:clamp(64px,17dvh,150px)}}
@media(min-width:99999px) and (max-height:700px){.c img.im3d{width:clamp(60px,15dvh,110px);height:clamp(60px,15dvh,110px)}}

/* movimiento de las escenas 3D */
@keyframes tambalea{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.e-pies{animation:tambalea 2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sube3{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}.e-guardia{animation:sube3 1.6s ease-in-out infinite}
@keyframes infla3{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}.e-resp{animation:infla3 2.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob3{50%{transform:translateY(-3px)}}.c img.im3d{animation:bob3 2.2s ease-in-out infinite}.c:nth-child(2) img.im3d{animation-delay:.25s}.c:nth-child(3) img.im3d{animation-delay:.5s}.c:nth-child(4) img.im3d{animation-delay:.75s}
@media(max-height:700px){.ill .esc3d{width:68px;height:68px}}
.shell:not(.conbg) #bg{display:none}

/* muñecos 3D: figura vertical a la izquierda y texto a la derecha, para que se vean grandes sin scroll */
.c:has(img.im3d){flex-direction:row;justify-content:flex-start;gap:6px;padding:4px 8px 4px 4px;text-align:left}
.c:has(img.im3d) b{flex:1;min-width:0}
.c img.im3d{height:clamp(84px,17dvh,150px);width:auto;max-width:48%;aspect-ratio:3/4;object-fit:contain;mix-blend-mode:multiply;flex:none}
@media(max-width:380px){.c:has(img.im3d){padding-right:12px}.c img.im3d{max-width:44%}}   /* celulares angostos: el texto no toca el borde de la tarjeta */
.c.chico:has(img.im3d){padding:2px 8px 2px 2px}.c.chico img.im3d{height:clamp(62px,12.4dvh,112px)}
@media(min-width:99999px){.c:has(img.im3d){padding:6px 14px 6px 8px;gap:12px}.c img.im3d{height:clamp(100px,22dvh,190px)}.c.chico img.im3d{height:clamp(78px,15.5dvh,140px)}}
@media(min-width:99999px) and (max-height:700px){.c img.im3d{height:clamp(92px,20dvh,150px)}.c.chico img.im3d{height:clamp(70px,14.5dvh,110px)}}

.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:#0b0f0c;color:#fff;padding:11px 18px;border-radius:30px;font-weight:700;font-size:14.5px;opacity:0;transition:opacity .3s,transform .3s;z-index:90;box-shadow:0 8px 30px #0003;max-width:90vw;text-align:center}.toast.in{opacity:1;transform:translate(-50%,0)}
/* en el quiz el aviso va abajo, sobre el pie legal, para no tapar el título (la app usa .toast sin .abajo) */
.toast.abajo{top:auto;bottom:calc(var(--pie,64px) + 12px);transform:translate(-50%,20px)}.toast.abajo.in{transform:translate(-50%,0)}
.tbar.up{text-transform:uppercase;letter-spacing:.03em;font-size:12.5px;background:#7f1d1d}.tbar.up b{color:#fff}
.gracias{text-align:center;padding-top:8px}.gracias .tick{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1fbf5b,#15803d);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 10px 26px rgba(22,163,74,.35)}.gracias .tick svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.precio2{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-top:6px}
/* barra de progreso del quiz: tarjeta redondeada y centrada, justo debajo del video (o arriba de todo si no hay video). Solo en las páginas con .shell: la app usa su propia .prog */
body:has(#shell) .prog{top:12px;left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;height:10px;border-radius:99px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,28,.12);transition:top .35s}
body:has(#shell) .prog i{border-radius:99px;box-shadow:none}

body:has(#shell.conbg) .prog{top:calc(clamp(72px,15dvh,150px) + 6px)}

@media(min-width:99999px){
 body:has(#shell) .prog{top:14px;width:min(calc(100% - 56px),520px)}
 body:has(#shell) main{padding-top:32px}
 body:has(#shell.conbg) .prog{top:14px;left:75%;width:min(calc(50% - 56px),464px)}
 body:has(#shell.conbg) main{padding-top:32px}
}
/* Tarjeta grande del especialista (funnel de bajar de peso) */
.med{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px 16px 16px;text-align:center;box-shadow:0 14px 34px rgba(11,15,12,.08);display:flex;flex-direction:column;align-items:center;animation:medSube .6s cubic-bezier(.3,.8,.3,1) both}

.med-foto img,.med-foto>i{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;background:linear-gradient(135deg,var(--g),#065f46);color:#fff;font:800 28px/1 system-ui;font-style:normal}
.med-mn{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:800;background:#fef9c3;color:#854d0e;border:2px solid #fff;border-radius:99px;padding:2px 9px;box-shadow:0 2px 6px rgba(0,0,0,.12)}

.med-l svg{flex:none;width:30px;height:30px;padding:6px;border-radius:10px;background:#ecfdf3;fill:none;stroke:var(--gd);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* CSS propio del quiz de bajar de peso (/quiz-peso/). Se carga después de base.css y manda base.css: tarjetas con muñeco, filas .ill, franja de regalo, carga y pop-ups
   salen de ahí, igual que en /quiz/. Acá solo van las piezas que /quiz/ no tiene: medidas, barra de IMC y proyección. */

/* Con 3 o 5 opciones la última queda centrada abajo, en vez de suelta a la izquierda */
.grid>.c:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 5px)}
/* En las de selección múltiple el texto deja lugar a la casilla */
.c:has(.chk) b{padding-right:22px}

/* Primera pantalla: video, prueba social, título y subtítulo de 2 líneas, 4 tarjetas y regalo. En celulares bajos las tarjetas se achican un poco para que entre sin scroll */
@media(max-width:99999px) and (max-height:700px){
 .hook .c{min-height:clamp(88px,17.4dvh,156px)}
 .hook .c img.im3d{height:clamp(80px,15.6dvh,150px)}
}

/* Estas pantallas ocupan todo el alto de la ventana, del título al pie legal (quiz-peso.js pone .alto en el .shell y .alto, .filas o .fijo en la pantalla):
   «cuerpo», «meta», «causas» y «frenos» son tarjetas altas en 2 columnas; «forma», «actividad» y «zonas» son filas; el resto (.fijo) reparte su contenido entre el título y el botón.
   La ventana fija el alto y el sobrante lo reparten las tarjetas o las filas: los muñecos se achican o crecen con ellas y nunca empujan la pantalla hacia abajo.
   El botón de avanzar es siempre lo último de la pantalla y queda pegado arriba del pie legal. */
.shell.alto{height:100dvh;min-height:0;grid-template-rows:minmax(0,1fr)}
@media(max-width:99999px){.shell.alto.conbg{grid-template-rows:auto minmax(0,1fr)}}   /* con video arriba (mail y perfil) siguen siendo dos filas */
.shell.alto main{min-height:0;min-width:0;justify-content:flex-start;padding-bottom:calc(var(--pie,64px) + 2px)}
.scr.alto,.scr.filas,.scr.fijo{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.scr.alto .grid,.scr.filas .grid{flex:1 1 0;min-height:0}
.scr.alto .grid{grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:2px}
.scr.filas .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:8px}
.scr.alto.seis .grid{grid-template-rows:repeat(3,minmax(0,1fr))}   /* «causas» y «frenos»: 2 columnas x 3 filas */
.scr.filas.cuatro .grid{grid-template-rows:repeat(4,minmax(0,1fr))}   /* «forma» y «actividad»: 4 filas */
.scr.filas.tres .grid{grid-template-rows:repeat(3,minmax(0,1fr))}   /* «escaleras» y «tiempo»: 3 filas */
.scr.filas .grid>.c:last-child:nth-child(odd){grid-column:auto;justify-self:stretch;width:auto}
.scr.alto .cta,.scr.filas .cta{flex:none;margin-top:12px}   /* igual que el botón de las demás pantallas */
.scr.fijo>.cta{flex:none;margin-top:auto}
.scr.fijo>:where(:has(+.cta)){padding-bottom:8px}   /* aire mínimo sobre el botón; el resto del sobrante queda en otros lugares de la pantalla */

/* Tarjeta alta: muñeco grande arriba, centrado, y el texto centrado abajo */
.scr.alto .c:has(img.im3d){flex-direction:column;justify-content:flex-start;align-items:center;gap:4px;min-height:0;padding:8px 8px 10px;text-align:center}
.scr.alto .c img.im3d{flex:1 1 0;min-height:0;width:100%;max-width:100%;height:auto;aspect-ratio:auto;object-fit:contain}
.scr.alto .c:has(img.im3d) b{flex:none;display:flex;align-items:center;justify-content:center;min-height:2.4em;padding-right:0;font-size:clamp(14px,2.3dvh,17px);line-height:1.2}   /* alto de 2 líneas siempre: los textos de las tarjetas quedan alineados */

/* Fila: una por opción, a todo el ancho, con el muñeco a la altura de la fila y el texto al lado; si es de selección múltiple, la casilla va a la derecha */
.scr.filas .c:has(img.im3d){flex-direction:row;justify-content:flex-start;align-items:center;gap:10px;min-height:0;padding:3px 12px;text-align:left}
.scr.filas .c:has(img.im3d):has(.chk){padding-right:48px}
.scr.filas .c img.im3d{flex:none;height:100%;width:auto;max-width:none;aspect-ratio:3/4}
.scr.filas .c:has(img.im3d) b{flex:1;min-width:0;padding-right:0;font-size:clamp(15px,2.6dvh,19px)}
.scr.filas .c .chk{top:50%;right:14px;margin-top:-11px;width:22px;height:22px}
.scr.filas .c.on .chk:after{left:6px;top:2px}

/* Pantallas informativas: las tres filas se reparten el alto y el muñeco crece con la fila, como en «zonas» */
.scr.fijo .ill{flex:1 1 0;min-height:0;margin:4px 0;padding:6px 12px}
.scr.fijo .ill:has(+.cta){margin-bottom:8px}
.scr.fijo .ill .esc3d{width:auto;height:100%;aspect-ratio:3/4;max-width:none}
.scr.fijo .ill>div{min-width:0}
.scr.fijo .ill b{font-size:clamp(15px,2.6dvh,19px)}
.scr.fijo .ill span{display:block;line-height:1.3;font-size:clamp(13px,2.1dvh,15.5px)}

/* Medidas: altura, peso y meta */
.mu{display:block;margin:0 auto;height:clamp(90px,24dvh,200px);width:auto;aspect-ratio:3/4;object-fit:contain;mix-blend-mode:multiply;animation:bob3 2.2s ease-in-out infinite}
/* con el botón abajo, el muñeco ocupa el alto que sobra entre el subtítulo y el campo (con tope); si no entra se achica y nunca hay scroll */
.scr.fijo .mu{flex:1 1 0;min-height:0;width:100%;height:auto;max-height:min(340px,42dvh);aspect-ratio:auto;margin:auto 0}
.scr.medida>.cta{margin-top:8px}   /* el sobrante lo toman los márgenes del muñeco, no el botón */
.nbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.nbox input{width:clamp(130px,42%,180px);margin:0;padding:10px 12px;text-align:center;font-size:34px;font-weight:800;letter-spacing:.02em}
.nbox input::placeholder{color:#c5cec8;font-weight:700}
.nbox span{font-size:22px;font-weight:700;color:var(--m)}
.msg{flex:none;min-height:7.4rem;margin:2px 0 0}
@media(min-height:701px){.msg{min-height:9.5rem}}   /* alcanza para el aviso más largo (bajo peso): el campo no salta al escribir */
.msg .m{font-size:14px;line-height:1.4}
.msg .err{color:#b91c1c;font-weight:600;text-align:center;padding:8px 4px}
.msg .ok,.msg .aviso,.msg .bajo{border-radius:var(--r);padding:11px 14px}
.msg .ok{background:#f0fdf4;border:1px solid #c8f1d6;color:#14532d}
.msg .aviso{background:#fffbe6;border:1px solid #fde68a;color:#854d0e}
.msg .bajo{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
.msg p{margin:4px 0 0}.msg small{display:block;margin-top:5px;font-size:11.5px;opacity:.9}.msg a{color:inherit}
.msg .cat{font-weight:700;opacity:.85}
.msg .bajo a.cta{margin-top:10px;padding:11px;color:var(--t)}
.medida .cta{margin-top:8px}

/* Pantallas informativas: cita de la fuente y cierre */
.cita{font-size:11px;line-height:1.35;color:#5b665e;text-align:center;margin:6px 0 0}
.cita a{color:#5b665e;display:inline-block;padding:10px 0;margin:-10px 0}
.cierre{margin-top:10px;margin-bottom:0}
.nota .aviso{display:none;font-weight:700;color:#7c5a0b;background:#fffbe6;border:1px solid #fde68a;border-radius:10px;padding:5px 9px;margin:0 0 6px}
@media(max-height:960px){.nota .cu{display:none}.nota .aviso{display:block}}

/* Perfil: barra de IMC y proyección dentro de los .box de siempre */
.perfil .box .row{align-items:baseline;flex-wrap:wrap}
.perfil .box .vimc{font-size:14.5px;font-weight:700;color:var(--gd)}
@media(max-width:400px){.perfil .box .vimc{font-size:13px}}
.imcb{position:relative;display:flex;height:12px;margin:14px 0 4px;border-radius:99px;overflow:visible}
.imcb s{display:block;height:100%;text-decoration:none}
.imcb .b0{background:#bfdbfe;border-radius:99px 0 0 99px}.imcb .b1{background:#86efac}.imcb .b2{background:#fde68a}.imcb .b3{background:#fca5a5;border-radius:0 99px 99px 0}
.imcb i{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#0b0f0c;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.imcl{display:flex;font-size:10px;color:var(--m);text-align:center}.imcl span{display:block;white-space:nowrap;overflow:visible}
.graf{display:block;width:100%;height:auto;margin-top:4px;overflow:visible}
.evento{margin:8px 0 0;text-align:center;font-weight:700;color:var(--gd);font-size:15px}
.nota-est{margin:8px 2px 0;font-size:11.5px;line-height:1.4;color:var(--m);text-align:center}
.nota-est a{color:#5b665e;display:inline-block;padding:10px 0;margin:-10px 0}
/* El nombre largo no hace crecer el título: en celulares bajos se corta con «…» antes de pasar a dos líneas */
@media(max-height:700px){.perfil .nom{display:inline-block;max-width:max(4em,calc(100vw - 190px));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}}
@media(max-height:700px){
 .perfil .box .row{gap:6px}.perfil .box .row b{font-size:15px}.perfil .box .vimc{font-size:12.5px}   /* «Tu punto de partida» y el IMC entran en una sola línea */
 .imcb{margin:10px 0 3px}.graf{margin-top:0}
 .evento{margin-top:4px;font-size:14px}.nota-est{margin-top:5px;font-size:11px;line-height:1.33}
 .msg{min-height:6.2rem}
}

/* «experto», «mail» y «perfil»: el contenido se reparte entre el título y el botón */
.scr.experto .exp{flex:0 1 auto;max-height:760px;margin:auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,1.2dvh,12px)}
.scr.experto .exp ul{align-self:stretch}
.scr.experto .av{width:clamp(58px,11dvh,100px);height:clamp(58px,11dvh,100px);font-size:clamp(19px,3.6dvh,32px);margin-bottom:0}
.scr.experto .sub+.chips{margin-top:auto}   /* sin tarjeta de especialista */
.scr.mail .tag,.scr.mail input{margin-top:auto}   /* título, campo y botón quedan separados por el mismo aire */
.scr.mail input{padding-top:clamp(15px,2.2dvh,22px);padding-bottom:clamp(15px,2.2dvh,22px)}
@media(max-width:99999px) and (min-height:700px){.shell.alto.conbg:has(.scr.mail) #bg{height:clamp(72px,24dvh,260px)}}   /* en celulares altos el video de «mail» ocupa un poco más */
/* El perfil no tiene nada que se pueda achicar: en un celular bajo, si no entra, la página crece y se scrollea, y el botón nunca queda debajo del pie legal */

.scr.publicacion .nota .im svg{stroke:#9fb0a5;width:64px;height:64px}
.scr.publicacion .nota .tx{flex:none}
.scr.publicacion>.cta{flex:none;margin-top:0}
.scr.publicacion>.cta+.cta{margin-top:10px}

/* Perfil: tarjetas de resultados con animación al aparecer (las barras se llenan, la línea se dibuja). Con movimiento reducido no se anima nada y quedan en su estado final. */
.perfil .box.res{animation:rsube .55s cubic-bezier(.3,.8,.3,1) var(--d,0s) both}
.rbar{height:10px;border-radius:99px;background:#e3eae5;overflow:hidden;margin-top:9px}
.rbar i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--c);animation:rllena 1.1s cubic-bezier(.3,.8,.3,1) calc(var(--d,0s) + .25s) both}

.graf .ga{animation:raparece .8s ease 1.6s both}
.graf .gp0{animation:raparece .4s ease .7s both}.graf .gp1{animation:raparece .4s ease 2.1s both}
@keyframes rsube{from{opacity:0;transform:translateY(12px)}}
@keyframes rllena{from{width:0}}
@keyframes rmarca{from{left:1%}}
@keyframes rtraza{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes raparece{from{opacity:0}}
/* Perfil como informe: la página se scrollea, el título queda debajo de la barra de progreso y las tarjetas respiran */
.scr.perfil h2{margin:22px 0 10px}
.scr.perfil .box.res{margin:0 0 12px;padding:14px 14px 12px}
.scr.perfil .box.res>b{font-size:16px}
.fila{margin-top:13px}
.fila .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px;font-weight:600}

.scr.perfil .rtx{margin:12px 0 0;font-size:12.5px}

/* Si la dirección trae campaña, se guarda en bc_utm pisando lo anterior (fbc = fb.1.<ahora>.<fbclid> solo con un fbclid nuevo). Sin campaña en la dirección queda lo guardado. */
function capturaCampana() {

  const mismo = Object.keys(nueva).length === Object.keys(previa).filter((k) => k !== 'ts').length && Object.keys(nueva).every((k) => nueva[k] === previa[k]);
  nueva.ts = mismo && previa.ts ? previa.ts : Date.now();                       // la misma campaña vista de nuevo no renueva los 30 días

}

function nuevoUuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256); }
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;                            // UUID v4
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}

/* Cálculos del funnel de bajar de peso. Funciones puras, sin DOM: se usan en el quiz y en la oferta.
   Las cifras salen solo de acá (IMC, meta, semanas, fecha). El ritmo de 0,5 kg por semana es una estimación prudente, no una promesa. */
const CALC = {
  RITMO_KG_SEMANA: 0.5,
  LIMITES: { altura: [140, 220], peso: [40, 250] },

  /* IMC sin redondear. */
  imc(pesoKg, alturaCm) {
    const m = alturaCm / 100;
    return pesoKg / (m * m);
  },

  categoria(imc) {
    if (imc < 18.5) return 'bajo';
    if (imc < 25) return 'normal';
    if (imc < 30) return 'sobrepeso';
    return 'obesidad';
  },

  /* Peso más bajo que sigue dentro del rango normal para esa altura (IMC 18,5), redondeado hacia arriba. */
  pesoMinimoSano(alturaCm) {
    const m = alturaCm / 100;
    return Math.ceil(18.5 * m * m);
  },

  /* motivo: '' si está bien, 'igual' si la meta no es menor al peso actual, 'bajo' si queda por debajo del mínimo sano. */
  validarMeta(peso, meta, alturaCm) {
    const minimo = CALC.pesoMinimoSano(alturaCm);
    if (!Number.isFinite(peso) || !Number.isFinite(meta)) return { ok: false, motivo: 'igual', minimo };
    if (meta >= peso) return { ok: false, motivo: 'igual', minimo };
    if (meta < minimo) return { ok: false, motivo: 'bajo', minimo };
    return { ok: true, motivo: '', minimo };
  },

  /* Porcentaje del peso actual que hay que bajar, entero. */
  porcentaje(peso, meta) {
    return Math.round(((peso - meta) / peso) * 100);
  },

  semanas(peso, meta) {
    return Math.max(1, Math.ceil((peso - meta) / CALC.RITMO_KG_SEMANA));
  },

  fechaMeta(desdeDate, semanas) {
    const d = new Date(desdeDate.getTime());
    d.setDate(d.getDate() + semanas * 7);
    return d;
  },

  /* 'marzo de 2027' (es-AR), con meses propios para no depender del navegador. */
  mesAnio(date) {
    const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    return `${meses[date.getMonth()]} de ${date.getFullYear()}`;
  },

  /* Descenso suave de peso a meta: arranca un poco más rápido y se aplana al final, siempre bajando (sin rebotes).
     Devuelve `puntos` valores {x: 0..1, kg}; el primero es el peso actual y el último, la meta. */
  curva(peso, meta, puntos = 12) {
    const n = Math.max(2, Math.floor(puntos));
    const salida = [];
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1);
      const avance = 0.6 * x * (2 - x) + 0.4 * x;   // 0 en x=0, 1 en x=1, creciente
      salida.push({ x, kg: i === n - 1 ? meta : peso - (peso - meta) * avance });
    }
    return salida;
  },
};

    imc = imc1(imc);
    const pos = Math.min(99, Math.max(1, ((imc - 15) / 25) * 100));
    return `<div class="imcb" role="img" aria-label="IMC ${coma(imc)}: ${NOMBRE_CAT[CALC.categoria(imc)]}"><s class="b0" style="width:14%"></s><s class="b1" style="width:26%"></s><s class="b2" style="width:20%"></s><s class="b3" style="width:40%"></s><i style="left:${pos.toFixed(1)}%"></i></div>` +
      '<div class="imcl"><span style="width:14%">Bajo</span><span style="width:26%">Normal</span><span style="width:20%">Sobrepeso</span><span style="width:40%">Obesidad</span></div>';
  }

  /* Proyección de peso de hoy a la meta con CALC.curva. */
  function grafico(peso, meta, fechaTxt) {
    const W = 320, H = 130, pl = 16, pr = 16, pt = 34, pb = 34;   // más baja en celulares chicos para que el perfil entre sin scroll
    const pts = CALC.curva(peso, meta, 40);
    const rango = Math.max(1, peso - meta);
    const X = (x) => +(pl + x * (W - pl - pr)).toFixed(1);
    const Y = (kg) => +(pt + (1 - (kg - meta) / rango) * (H - pt - pb)).toFixed(1);
    const linea = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x)} ${Y(p.kg)}`).join('');
    const area = `${linea}L${X(1)} ${H - pb}L${X(0)} ${H - pb}Z`;
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de ${peso} kg hoy a ${meta} kg en ${esc(fechaTxt)}">` +
      '<defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16A34A" stop-opacity=".28"/><stop offset="1" stop-color="#16A34A" stop-opacity="0"/></linearGradient></defs>' +
      `<line x1="${pl}" y1="${H - pb}" x2="${W - pr}" y2="${H - pb}" stroke="#d6e0d9" stroke-width="1.5"/>` +
      `<line x1="${X(0)}" y1="${Y(meta)}" x2="${X(1)}" y2="${Y(meta)}" stroke="#16A34A" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>` +
      `<path class="ga" d="${area}" fill="url(#gp)"/><path class="gl" pathLength="1" d="${linea}" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<g class="gp0"><circle cx="${X(0)}" cy="${Y(peso)}" r="5.5" fill="#fff" stroke="#0b0f0c" stroke-width="2.6"/><text x="${X(0)}" y="${Y(peso) - 12}" font-size="13" font-weight="800" fill="#0b0f0c">Hoy ${peso} kg</text></g>` +
      `<g class="gp1"><circle cx="${X(1)}" cy="${Y(meta)}" r="6.5" fill="#16A34A" stroke="#fff" stroke-width="2.4"/>` +
      `<text x="${X(1)}" y="${H - pb + 20}" font-size="13" font-weight="800" fill="#15803d" text-anchor="end">${meta} kg · ${esc(fechaTxt)}</text></g></svg>`;
  }

  /* Validación de los campos numéricos. Devuelve { ok, n, html, tono, incompleto } según lo tipeado. */
  function evaluaMedida(x, crudo) {
    const n = crudo ? parseInt(crudo, 10) : NaN;
    const vacio = { ok: false, n, html: '', tono: '' };
    if (!crudo) return vacio;
    if (x.k === 'edad') return { ok: true, n, html: '', tono: '' };
    if (x.k === 'altura') {
      const [lo, hi] = CALC.LIMITES.altura;
      if (n >= lo && n <= hi) return { ok: true, n, html: '', tono: '' };
      if (crudo.length < String(lo).length) return vacio;
      return { ok: false, n, html: `Ingresá una altura entre ${lo} y ${hi} cm.`, tono: 'err' };
    }
    if (x.k === 'peso') {
      const [lo, hi] = CALC.LIMITES.peso;
      if (!(n >= lo && n <= hi)) {
        if (crudo.length < String(lo).length) return vacio;
        return { ok: false, n, html: `Ingresá un peso entre ${lo} y ${hi} kg.`, tono: 'err' };
      }
      if (!A.altura) return { ok: true, n, html: '', tono: '' };
      const imc = imc1(CALC.imc(n, A.altura));
      const cat = CALC.categoria(imc);
      const cab = `<b>Tu IMC: ${coma(imc)}</b> <span class="cat">${NOMBRE_CAT[cat]}</span>`;
      const pie = '<small>El IMC es una referencia general.</small>';
      /* Pegado al mínimo sano no existe ninguna meta válida (peso > mínimo): se trata como bajo peso para no dejar un callejón sin salida en pesoMeta. */
      if (cat === 'bajo' || n <= CALC.pesoMinimoSano(A.altura)) return { ok: false, n, tono: 'bajo', html: `${cab}<p>Con tu altura y tu peso no necesitás bajar. Este plan no es para vos: consultá con un profesional.</p><a class="cta s" href="/quiz/">Ver el plan de técnica</a>` };
      if (cat === 'normal') return { ok: true, n, tono: 'ok', html: `${cab}<p>Estás en un rango normal. Igual podés mejorar cómo te sentís.</p>${pie}` };
      if (cat === 'sobrepeso') return { ok: true, n, tono: 'ok', html: `${cab}<p>Es un punto de partida, no un veredicto.</p>${pie}` };
      return { ok: true, n, tono: 'aviso', html: `${cab}<p>Es un punto de partida, no un veredicto. Consultá con tu médico antes de arrancar.</p>${pie}` };
    }
    /* pesoMeta */
    const alt = A.altura || 170, peso = A.peso || 0;
    const v = CALC.validarMeta(peso, n, alt);
    if (v.motivo === 'igual') return { ok: false, n, tono: 'err', html: 'Tu meta tiene que ser menor a tu peso actual.' };
    if (v.motivo === 'bajo') {
      if (crudo.length < String(v.minimo).length) return vacio;
      return { ok: false, n, tono: 'err', html: `Por tu altura, no te recomendamos bajar de ${v.minimo} kg.` };
    }
    const kg = peso - n;
    const exacto = (kg / peso) * 100;
    const cdc = exacto >= 5 && fuenteOk('beneficio')
      ? `<p>Perder entre 5 y 10% del peso corporal probablemente mejora la presión, el colesterol y la glucemia.</p><small>Fuente: ${enlaceFuente('CDC (archivo de 2018)', F.beneficio.url)}</small>`
      : '';
    return { ok: true, n, tono: 'ok', html: `<b>Son ${kg} kg${CALC.porcentaje(peso, n) >= 1 ? `, un ${CALC.porcentaje(peso, n)}% de tu peso` : ''}.</b>${cdc}` };
  }

    } else if (x.t === 'multi') {

        filaIll(escena('info30', 2), 'Sin plan, cuesta sostener', 'Es fácil arrancar fuerte, improvisar y largar a las pocas semanas.') +
        `${cita}<p class="sub cierre">Por eso conviene moverse con un plan, y no improvisar.</p><button class="cta" id="seguir">Seguir</button>`;
    } else if (x.t === 'infoboxeo') {
      h = `<h2>Por qué te sirve aunque nunca hayas boxeado</h2>` +
        filaIll(escena('infoboxeo', 0), 'Todo el cuerpo', 'Piernas, torso y brazos se mueven a la vez.') +

        '<button class="cta" id="seguir">Seguir</button>';
    } else if (x.t === 'noticia') {

    } else if (x.t === 'medida') {
      const previo = A[x.k] ? String(A[x.k]) : x.def;
      h = `<h2>${esc(x.titulo)}</h2><p class="sub">${esc(x.sub)}</p>${img3d(x.muneco, 'mu')}<div class="slid"><output id="v" for="n"><b>${esc(previo)}</b><span>${esc(x.unidad)}</span></output><input id="n" type="range" min="${x.min}" max="${x.max}" step="1" value="${esc(previo)}" aria-label="${esc(x.titulo)}"><div class="rng"><span>${x.min} ${esc(x.unidad)}</span><span>${esc(x.maxTxt || x.max + ' ' + x.unidad)}</span></div></div><div class="msg" id="msg" role="status" aria-live="polite"></div><button class="cta" id="seguir" disabled>Seguir</button>`;
    } else if (x.t === 'experto') {
      h = `<div class="tag cen">Tu plan personalizado</div><h2>Tu plan sigue el método del Dr. Medina</h2><p class="sub">Con tus respuestas ajustamos tus 4 semanas al tiempo que tenés.</p>${tarjetaMedico()}${chipsPrivado(false)}<button class="cta" id="seguir">Ver mi análisis →</button>`;
    } else if (x.t === 'carga') {

    raiz.innerHTML = `<div class="scr ${x.t}${x.video === 'hook' ? ' hook' : ''}${x.video === 'hook' ? ' edad cuerpo' : ''}${x.alto ? ' alto' : ''}${x.filas ? ' filas' : ''}${llena ? ' ' + llena : ''}">${h}</div>`;

  function perfil() {
    const tienePeso = A.peso && A.altura;
    let h = `<h2>Así queda tu plan</h2>`;
    if (tienePeso) {
      const imc = imc1(CALC.imc(A.peso, A.altura));
      h += `<div class="box res" style="--d:.1s"><div class="row"><b>Tu punto de partida</b><span class="vimc">IMC ${coma(imc)} · ${NOMBRE_CAT[CALC.categoria(imc)]}</span></div>${barraImc(imc)}</div>`;
    }
    /* «Tu condición hoy»: cada barra sale de una respuesta del quiz (nada inventado). [valor 0-100, etiqueta, nivel 0 bajo / 1 medio / 2 alto] */
    const NIV = [['#f59e0b', '#b45309'], ['#84cc16', '#4d7c0f'], ['#16A34A', '#15803d']];
    const barras = [
      ['Movimiento actual', { 'Nada': [10, 'Muy bajo', 0], 'Alguna que otra vez': [30, 'Bajo', 0], 'Una vez por semana': [55, 'Medio', 1], 'Varias veces por semana': [85, 'Alto', 2] }[A.actividad]],
      ['Resistencia', { 'Sin aire': [25, 'Para trabajar', 0], 'Agitado, pero bien': [58, 'Media', 1], 'Tranquilo': [88, 'Buena', 2] }[A.escaleras]],
      ['Descanso', { 'Menos de 5 horas': [22, 'Corto', 0], '5 a 6 horas': [50, 'Justo', 1], '7 a 8 horas': [90, 'Bueno', 2], 'Más de 8 horas': [80, 'Bueno', 2] }[A.sueno]],
      ['Tiempo para entrenar', { 'Arranque': [35, '2-3 días', 0], 'Ritmo': [65, '3-4 días', 1], 'Impulso': [92, '4-5 días', 2] }[A.tiempo]],
    ].filter((x) => x[1]);
    if (barras.length) {
      h += '<div class="box res" style="--d:.35s"><b>Tu condición hoy</b>' + barras.map(([t, v], i) =>
        `<div class="fila" style="--d:${(0.5 + i * 0.18).toFixed(2)}s"><div class="row"><span>${t}</span><span class="vimc" style="color:${NIV[v[2]][1]}">${v[1]}</span></div><div class="rbar" role="img" aria-label="${t}: ${v[1]}"><i style="--w:${v[0]}%;--c:${NIV[v[2]][0]}"></i></div></div>`).join('') +
        '<p class="rtx">El plan arranca desde donde estás hoy y ajusta la carga a tu tiempo.</p></div>';
    }
    if (tienePeso && A.pesoMeta && A.pesoMeta < A.peso) {
      const sem = CALC.semanas(A.peso, A.pesoMeta);
      const fecha = CALC.mesAnio(CALC.fechaMeta(new Date(), sem));
      h += `<div class="box res" style="--d:1.1s"><b>Tu proyección</b>${grafico(A.peso, A.pesoMeta, fecha)}</div>`;
    }
    const ev = { 'Vacaciones': 'tus vacaciones', 'Un casamiento o evento': 'ese casamiento o evento', 'Un cumpleaños': 'tu cumpleaños' }[A.evento];
    if (ev) h += `<p class="evento">Tu plan de 4 semanas puede ser un primer paso hacia ${ev}.</p>`;
    h += '<p class="nota-est">Estimación a 0,5 kg por semana, un ritmo prudente. Tu plan dura 4 semanas; la fecha supone que seguís entrenando al mismo ritmo después. Depende de lo que comas, de tu descanso y de cuánto sostengas el plan. No es una promesa.';
    if (fuenteOk('ritmo')) h += ` Bajar de a poco ayuda a mantener el peso perdido (${enlaceFuente('CDC', F.ritmo.url)}).`;
    h += '</p><button class="cta" id="ver">Ver mi plan</button>';
    return h;
  }

  function enlaza(x) {
    const q = (sel) => raiz.querySelector(sel);
    if (x.t === 'q') {
      raiz.querySelectorAll('.c').forEach((b) => (b.onclick = () => {
        if (bloqueado) return;
        bloqueado = true;
        const o = x.o[+b.dataset.i];
        b.classList.add('on'); A[x.k] = o[0]; guardaA(); vib(); ondaYSonido(b); setTimeout(siguiente, 320);
      }));
    } else if (x.t === 'multi') {
      const sel = new Set();
      const tarjetas = [...raiz.querySelectorAll('.c')];
      tarjetas.forEach((b) => (b.onclick = () => {
        const i = +b.dataset.i;
        ondaYSonido(b);
        if (sel.has(i)) sel.delete(i);
        else {
          /* «Todo un poco» no se combina con las zonas puntuales. */
          if (x.solo !== undefined) { if (i === x.solo) sel.clear(); else sel.delete(x.solo); }
          sel.add(i);
        }
        tarjetas.forEach((c, j) => { c.classList.toggle('on', sel.has(j)); c.setAttribute('aria-pressed', sel.has(j) ? 'true' : 'false'); });
        q('#seguir').disabled = sel.size === 0; vib(8);
      }));
      q('#seguir').onclick = () => { A[x.k] = [...sel].sort((a, b) => a - b).map((i) => x.o[i][0]); guardaA(); siguiente(); };
    } else if (x.t === 'info30' || x.t === 'infoboxeo' || x.t === 'experto') {
      q('#seguir').onclick = siguiente;
    } else if (x.t === 'noticia') {
      q('#seguir').onclick = () => { A.noticia = 'si'; guardaA(); siguiente(); };
      q('#seguir2').onclick = () => { A.noticia = 'no'; guardaA(); siguiente(); };
    } else if (x.t === 'publicacion') {
      q('#seguir').onclick = () => { A.publicacion = 'si'; guardaA(); siguiente(); };
      q('#seguir2').onclick = () => { A.publicacion = 'no'; guardaA(); siguiente(); };
    } else if (x.t === 'medida') {
      const inp = q('#n'), btn = q('#seguir'), msg = q('#msg'), salida = q('#v b');
      let valor = null;
      const revisa = () => {
        salida.textContent = inp.value;
        inp.style.setProperty('--p', ((inp.value - inp.min) / (inp.max - inp.min) * 100) + '%');
        const r = evaluaMedida(x, inp.value);
        valor = r.ok ? r.n : null;
        btn.disabled = !r.ok;
        msg.innerHTML = r.html ? `<div class="m ${r.tono || ''}">${r.html}</div>` : '';
      };
      inp.addEventListener('input', revisa);
      btn.onclick = () => {
        if (valor === null || bloqueado) return;
        bloqueado = true;
        A[x.k] = valor; guardaA(); siguiente();
      };
      revisa();
      enfocaTitulo(raiz);   // el deslizador no abre el teclado en celular
    } else if (x.t === 'perfil') {
      q('#ver').onclick = () => { guardaA(); location.href = '/oferta-peso/' + consultaCampana(); };
    }
  }

  /* Carga: 6 mensajes de ~1,6 s cada uno. El análisis se frena en dos puntos hasta que la persona responde un pop-up. */
  function cargando() {
    const R = 402;
    const imcTxt = A.peso && A.altura ? `Calculando tu punto de partida: IMC ${coma(CALC.imc(A.peso, A.altura))}` : 'Calculando tu punto de partida…';
    const detalleTiempo = { Arranque: '2-3 días · 15-30 min', Ritmo: '3-4 días · 30-40 min', Impulso: '4-5 días · 45-60 min' }[A.tiempo] || A.tiempo || '';
    const msgs = [
      'Analizando tus respuestas…',
      imcTxt,
      `Eligiendo el nivel de carga según tu tiempo: ${detalleTiempo}`,
      'Armando tu progresión desde cero…',
      'Armando tus 4 semanas de shadowboxing…',
      'Listo. Tu plan está armado.',
    ];
    const ETQ = ['Analizando', 'Tu punto de partida', 'Tu carga', 'Tu progresión', 'Tus 4 semanas', '¡Listo!'];
    raiz.innerHTML = `<div class="scr carga cg2"><h2>Estamos armando tu plan</h2><p class="sub">Con tus respuestas, en unos segundos</p><div class="ring cg-ring"><span class="cg-halo"></span><span class="cg-orb"><i></i><i></i><i></i></span><svg viewBox="0 0 150 150" aria-hidden="true"><defs><linearGradient id="cgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs><circle cx="75" cy="75" r="64" stroke="#e8efe9" stroke-width="10" fill="none"/><circle id="rc" cx="75" cy="75" r="64" stroke="url(#cgG)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R}"/></svg><div class="cg-centro"><b id="pc">0%</b><small id="cgEt">${ETQ[0]}</small></div></div><div class="cg-lista">${msgs.map((m, i) => `<div class="chkl" id="c${i}"><div class="ic"></div><div class="cg-tx">${esc(m)}<span class="cg-b"><i></i></span></div></div>`).join('')}</div></div>`;
    window.scrollTo(0, 0);
    enfocaTitulo(raiz);
    let p = 0, pausa = false;
    const paso = 100 / msgs.length;                 // cada mensaje ocupa un sexto del avance
    const hitos = [
      { en: Math.round(paso * 2), pregunta: '¿Podés entrenar a la misma hora todos los días?', opc: ['Sí, ya tengo mi horario', 'Algunos días'], dato: 'Un horario fijo ayuda a sostener la constancia.', aviso: 'Anotado', clave: 'horaFija' },
      { en: Math.round(paso * 4), pregunta: '¿Preferís entrenar a la mañana o a la noche?', opc: ['A la mañana', 'A la noche'], dato: 'Elegí el momento en el que más rendís.', aviso: 'Anotado', clave: 'momento' },
    ];
    const marca = () => msgs.forEach((_, i) => {
      const e = $('c' + i); if (!e) return;
      if (p >= (i + 1) * paso - 0.01) { if (!e.classList.contains('d')) { e.classList.add('d'); e.classList.remove('act'); e.querySelector('.ic').textContent = '✓'; } }
      else if (p >= i * paso) { e.classList.add('act'); e.style.setProperty('--p', Math.round(((p - i * paso) / paso) * 100) + '%'); const et = $('cgEt'); if (et) et.textContent = ETQ[i] || ''; }
    });
    const iv = setInterval(() => {
      if (pausa) return;
      p += 1; $('pc').textContent = p + '%'; $('rc').style.strokeDashoffset = R - (R * p) / 100;
      marca();
      const h = hitos.find((m) => p === m.en);
      if (h) {
        pausa = true;
        const v = document.createElement('div'); v.className = 'velo';
        v.innerHTML = `<div class="hoja"><div class="tag">Para terminar tu plan</div><h3>${esc(h.pregunta)}</h3><div class="globo">${esc(h.dato)}</div>${h.opc.map((t, i) => `<button class="cta${i ? ' s' : ''}" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
        document.body.appendChild(v);
        v.querySelectorAll('button').forEach((b) => (b.onclick = () => { A[h.clave] = h.opc[+b.dataset.i]; guardaA(); v.remove(); pausa = false; window.toast(h.aviso); }));
      }
      if (p >= 100) { clearInterval(iv); setTimeout(() => { if (S[s].t === 'carga') siguiente(); }, 900); }
    }, 96);                                          // 100 pasos x 96 ms ≈ 9,6 s (6 mensajes x 1,6 s)
  }

  /* El pie legal es fijo y su alto cambia con el ancho de la ventana: las pantallas a todo el alto (peso.css) llegan justo hasta él. */
  const ajustaPie = () => { const f = document.querySelector('.ft'); if (f) forma.style.setProperty('--pie', f.offsetHeight + 'px'); };
  pie(false, true, true);   // pie de comun.js: solo los dos enlaces, en pestaña nueva para no perder el quiz
  ajustaPie();
  window.addEventListener('resize', ajustaPie, { passive: true });
  dibuja();
  precargar();
})();

</script></body></html>
