<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#16A34A"><title>BeastCamp · Plan para bajar de peso en casa</title><link rel="preload" as="image" href="/media/hook.jpg" fetchpriority="high"><link rel="preload" as="image" href="/img/muneco-n_empiezo.webp" fetchpriority="high"><link rel="preload" as="image" href="/img/muneco-n_seis.webp" fetchpriority="high"><link rel="preload" as="image" href="/img/muneco-n_anios.webp" fetchpriority="high"><link rel="preload" as="image" href="/img/muneco-n_mas.webp" fetchpriority="high"><style>:root{--g:#16A34A;--g2:#4ade80;--gd:#15803d;--t:#0b0f0c;--m:#5b665e;--line:#e5ebe6;--bg:#fff;--soft:#f4f7f5;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button{font:inherit;color:inherit}
/* progreso fijo arriba */
.prog{position:fixed;top:0;left:0;right:0;height:6px;background:#e5ebe6;z-index:30}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:0 6px 6px 0;transition:width .5s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 12px rgba(74,222,128,.6)}
/* estructura: en compu video a la izquierda; en celular franja arriba */
.shell{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100dvh}
#bg{position:relative;height:0;overflow:hidden;background:#dff3e6;transition:height .35s}
#bg video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.15) contrast(1.03)}
#bg:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,#fff)}
.shell.conbg #bg{height:clamp(72px,15dvh,150px);margin-top:6px}
main{padding:10px 16px 66px;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
@media(min-width:900px){
 .shell{grid-template-rows:1fr}.shell.conbg{grid-template-columns:1fr 1fr}
 #bg{height:0;margin:0}.shell.conbg #bg{height:100dvh;position:sticky;top:0;margin-top:0}
 #bg:after{left:auto;top:0;bottom:0;right:0;width:90px;height:auto;background:linear-gradient(90deg,transparent,#fff)}
 main{padding:14px 28px 66px}
 .shell:not(.conbg) main{max-width:560px}
}
/* pie legal fijo */
.ft{position:fixed;left:0;right:0;bottom:0;z-index:20;text-align:center;color:#8a948d;font-size:10px;line-height:1.35;padding:14px 16px 8px;background:linear-gradient(transparent,#fff 45%);pointer-events:none}
.ft a{color:#6b756e;pointer-events:auto}
/* textos */
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}h2{font-size:23px;line-height:1.2;margin:4px 0 6px;text-align:center}
p{margin:0 0 10px}.sub{text-align:center;color:var(--m);font-size:14px;margin:0 0 12px}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--g);font-weight:800;margin:0 0 6px}
.cen{text-align:center}
/* pill de prueba social / gatillos */
.pill{align-self:center;display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:700;color:var(--gd);background:#ecfdf3;border:1px solid #c8f1d6;border-radius:99px;padding:5px 12px;margin:4px 0 8px}
.pill svg{width:15px;height:15px;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.estr{color:#f5a623;letter-spacing:2px}
.gift{margin:12px 0 0;font-size:12.5px;background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:9px 12px;color:#854d0e;display:flex;gap:10px;align-items:center}
.gift svg{width:26px;height:26px;flex:none;stroke:#b45309;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.gift svg .a{stroke:#b45309}
/* globo de dato */
.globo{position:relative;background:#f0fdf4;border:1px solid #c8f1d6;color:#14532d;border-radius:14px;padding:9px 12px 9px 38px;font-size:13px;margin:0 0 12px;line-height:1.35}
.globo:before{content:"";position:absolute;left:12px;top:11px;width:16px;height:16px;border-radius:50%;background:var(--g)}
.globo:after{content:"i";position:absolute;left:12px;top:11px;width:16px;height:16px;color:#fff;font:800 11px/16px system-ui;text-align:center}
/* tarjetas de opciones */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(96px,19dvh,156px);transition:.15s;position:relative;overflow:hidden}
.c:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,163,74,.15)}
.c.on{border-color:var(--g);background:#f0fdf4;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.c b{font-size:13.5px;line-height:1.25;font-weight:700}.c small{display:block;font-size:11.5px;color:var(--m);font-weight:500;margin-top:2px}
.c svg{width:clamp(50px,11dvh,92px);height:clamp(50px,11dvh,92px);flex:none}
.c.A svg *{fill:none;stroke:#0b0f0c;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.c.A svg .a *,.c.A svg .a{stroke:var(--g)}

@keyframes bob{50%{transform:translateY(-3px)}}.c.B svg .fig{animation:bob 1.7s ease-in-out infinite;transform-origin:50% 100%}.c.B:nth-child(2) .fig{animation-delay:.2s}.c.B:nth-child(3) .fig{animation-delay:.4s}.c.B:nth-child(4) .fig{animation-delay:.6s}
.c.chico{min-height:clamp(80px,14.5dvh,118px);padding:6px 6px}.c.chico svg{width:clamp(42px,8.6dvh,72px);height:clamp(42px,8.6dvh,72px)}.c.chico b{font-size:12.5px}
.c .chk{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:6px;border:2px solid #cfd8d2;background:#fff}
.c.on .chk{background:var(--g);border-color:var(--g)}.c.on .chk:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
/* botones */
.cta{display:block;width:100%;border:0;border-radius:14px;background:linear-gradient(180deg,#1fbf5b,var(--g));color:#fff;font-weight:800;font-size:17px;padding:16px;margin-top:12px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(22,163,74,.3);position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:brillo 3.2s infinite}
@keyframes brillo{0%{left:-60%}60%,100%{left:140%}}
.cta.s{background:#fff;color:var(--t);border:2px solid var(--line);box-shadow:none}.cta.s:after{display:none}.cta[disabled]{opacity:.45;box-shadow:none}
.box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px}
input[type=text],input[type=email]{width:100%;padding:15px;font-size:17px;border:2px solid #dfe6e1;border-radius:14px;margin-bottom:10px;font-family:inherit}
input:focus{outline:0;border-color:var(--g)}
/* entrada de pantallas */
.scr{animation:entra .35s ease both}@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.sale{opacity:0;transform:translateX(-18px);transition:.16s}
/* «Entrenar mal te frena» */
.ill{display:flex;gap:12px;align-items:center;margin:8px 0;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.ill .esc3d{width:84px;height:84px;object-fit:contain;mix-blend-mode:multiply;flex:none}.ill b{display:block;font-size:15px}.ill span{font-size:13px;color:var(--m)}
@keyframes sep{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}@keyframes sep2{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.esc .f1,.esc .p1{animation:sep 1.8s ease-in-out infinite}.esc .f2,.esc .p2{animation:sep2 1.8s ease-in-out infinite}
@keyframes sube{0%,100%{transform:translateY(7px)}45%{transform:translateY(-4px)}}.esc .guante-g{animation:sube 1.5s ease-in-out infinite}
@keyframes infla{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}.esc .pecho{animation:infla 2.4s ease-in-out infinite;transform-origin:48px 52px}
@keyframes exhala{0%{opacity:0;transform:translate(-8px,6px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-8px)}}.esc .aire circle{animation:exhala 2.4s ease-out infinite}.esc .aire circle:nth-child(2){animation-delay:.3s}.esc .aire circle:nth-child(3){animation-delay:.6s}
/* noticia */
.nota{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.07)}
.nota .im{height:120px;background:linear-gradient(135deg,#0b3d24,#16A34A 60%,#4ade80);display:flex;align-items:center;justify-content:center}
.nota .im img{width:100%;height:100%;object-fit:cover;display:block}.nota .im svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nota .tx{padding:12px 14px}.nota .et{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g);font-weight:800}
.nota h3{margin:4px 0 6px;font-size:17px;line-height:1.25}.nota p{font-size:13px;color:var(--m);margin:0 0 6px}.nota .fu{font-size:11.5px;color:#8a948d}.nota a{color:var(--gd)}
/* especialista */
.exp{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.06)}
.av{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--g),#065f46);color:#fff;font-weight:800;font-size:25px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 3px var(--g2);overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.exp .nm{font-size:18px;font-weight:800}.exp .ti{color:var(--m);font-size:14px}.exp .mt{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;background:#fef9c3;color:#854d0e;border-radius:99px;padding:2px 9px}
.exp ul{list-style:none;margin:10px 0 0;padding:0;text-align:left;font-size:12.5px;color:var(--m)}.exp li{margin:5px 0;padding-left:16px;position:relative}.exp li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--m)}.chips span{border:1px solid var(--line);border-radius:99px;padding:5px 10px;background:#f9fbf9;display:inline-flex;gap:5px;align-items:center}
.chips svg{width:13px;height:13px;stroke:var(--g);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
/* carga */
.ring{position:relative;width:150px;height:150px;margin:6px auto 10px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.chkl{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:15px;color:#9aa49d;transition:.3s}.chkl .ic{width:22px;height:22px;border-radius:50%;border:2px solid #d4dcd7;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.chkl.d{color:var(--t)}.chkl.d .ic{background:var(--g);border-color:var(--g)}
.velo{position:fixed;inset:0;background:rgba(236,243,239,.78);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}@keyframes fade{from{opacity:0}}
.hoja{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:sube2 .3s}@keyframes sube2{from{transform:translateY(30px)}}
.hoja .tag{text-align:center}.hoja h3{text-align:center;margin:4px 0 12px;font-size:19px}
/* oferta */
.tbar{position:sticky;top:6px;z-index:5;margin:0 0 10px;background:#0b0f0c;color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;text-align:center}.tbar b{color:var(--g2);font-size:16px;font-variant-numeric:tabular-nums}
.vid{position:relative;border-radius:var(--r);overflow:hidden;background:#000;margin:8px 0}.vid video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.sello{display:flex;gap:12px;align-items:center}.sello svg{width:40px;height:40px;flex:none;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.vs{display:flex;gap:8px;margin-top:10px}.vs>div{flex:1;font-size:13px;line-height:1.7;color:var(--m);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.vs small{display:block;font-weight:800;letter-spacing:.08em;margin-bottom:4px;color:#b91c1c}.vs .on{border-color:var(--g);background:#f0fdf4;color:var(--t)}.vs .on small{color:var(--g)}
.st{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}.st i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.sem{display:flex;gap:10px;margin:9px 0;font-size:14px}.sem b{flex:none;width:74px;color:var(--g)}.sem span{color:var(--m)}
.stack>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.stack s{color:var(--m);white-space:nowrap}.stack .tot{font-weight:800;border-bottom:0}
.big{font-size:46px;font-weight:900;color:var(--g);line-height:1.1}.note{font-size:13px;color:var(--m);margin-top:4px}.badge{margin-top:10px;font-size:13px;font-weight:700;color:var(--g)}
.garantia{display:flex;gap:12px;align-items:center;background:#f0fdf4;border:1px solid #c8f1d6;border-radius:var(--r);padding:14px;margin:12px 0}.garantia svg{width:44px;height:44px;flex:none;stroke:var(--g);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.faq details{border-top:1px solid var(--line);padding:10px 0;font-size:14px;color:var(--m)}.faq summary{font-weight:700;color:var(--t);cursor:pointer;font-size:15px}
.test2{display:flex;gap:10px;align-items:center;margin-top:10px}.test2 span{color:var(--m);font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:8px 14px 34px;box-shadow:0 -6px 20px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center}
.sticky span{font-size:12px;color:var(--m);flex:none;line-height:1.3}.sticky b{display:block;color:var(--g);font-size:16px}.sticky .cta{margin:0}
.oferta-main{padding-bottom:140px}.oferta-main .scr{animation:none}
.legal{max-width:680px;margin:0 auto;padding:22px 18px 80px;font-size:15px}.legal h1{font-size:26px}.legal h2{text-align:left;font-size:18px;margin-top:22px}.legal a{color:var(--gd)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* pantallas bajas (celulares chicos): todo entra sin scroll */

@media(max-height:700px){
 h2{font-size:21px;margin:2px 0 4px}.sub{margin-bottom:8px}.pill{margin:2px 0 6px}.gift{margin-top:8px;padding:7px 10px}.globo{margin-bottom:8px;padding-top:7px;padding-bottom:7px}
 .nota .im{height:60px}.nota .im svg{width:34px;height:34px}.nota .cu{display:none}.nota h3{font-size:16px}
 .ill{margin:5px 0;padding:4px 10px}.ill .esc{width:74px;height:74px}
 .experto .exp ul,.experto .exp p{display:none}.experto .av{width:58px;height:58px;font-size:19px}.experto .exp{padding:10px}.experto .chips{margin-top:8px}
 .perfil .tag{display:none}.perfil .box{padding:7px 12px;margin:5px 0}.perfil .sem{margin:2px 0;font-size:12.5px}.perfil h2{font-size:19px}.perfil .cta{margin-top:8px;padding:12px}
 .cta{padding:13px;margin-top:8px}.mail input{margin-bottom:7px}
}
@media(max-height:560px){.c b{font-size:12px}.c small{font-size:10.5px}.globo{display:none}.gift{display:none}}
/* compu: las tarjetas y los muñecos crecen con la altura de la ventana (no hay franja de video arriba) */
@media(min-width:900px){
 .c{min-height:clamp(110px,24dvh,205px)}.c svg{width:clamp(56px,14dvh,128px);height:clamp(56px,14dvh,128px)}
 .c.chico{min-height:clamp(88px,15.5dvh,140px)}.c.chico svg{width:clamp(46px,9.6dvh,84px);height:clamp(46px,9.6dvh,84px)}
 .c b{font-size:clamp(13px,2.2dvh,16px)}
 h2{font-size:clamp(22px,4.2dvh,30px)}
}
@media(min-width:900px) and (max-height:700px){.c{min-height:clamp(100px,21dvh,160px)}.c svg{width:clamp(54px,12.5dvh,100px);height:clamp(54px,12.5dvh,100px)}}
.perfil .box span{font-size:14.5px}
@media(min-width:900px){
 .velo{align-items:center}.hoja{border-radius:22px;max-width:460px;animation:fade .25s}
 .c.chico{flex-direction:row;justify-content:flex-start;gap:12px;padding:6px 14px;text-align:left}

 .c.chico b{font-size:clamp(13px,2.3dvh,16px)}
}

/* muñecos 3D generados (por ahora 3 opciones de prueba) */
.c img.im3d{width:clamp(50px,11.4dvh,92px);height:clamp(50px,11.4dvh,92px);object-fit:contain;mix-blend-mode:multiply;flex:none}
@media(min-width:900px){.c img.im3d{width:clamp(64px,17dvh,150px);height:clamp(64px,17dvh,150px)}}
@media(min-width:900px) and (max-height:700px){.c img.im3d{width:clamp(60px,15dvh,110px);height:clamp(60px,15dvh,110px)}}

/* movimiento de las escenas 3D */
@keyframes tambalea{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.e-pies{animation:tambalea 2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sube3{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}.e-guardia{animation:sube3 1.6s ease-in-out infinite}
@keyframes infla3{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}.e-resp{animation:infla3 2.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob3{50%{transform:translateY(-3px)}}.c img.im3d{animation:bob3 2.2s ease-in-out infinite}.c:nth-child(2) img.im3d{animation-delay:.25s}.c:nth-child(3) img.im3d{animation-delay:.5s}.c:nth-child(4) img.im3d{animation-delay:.75s}
@media(max-height:700px){.ill .esc3d{width:68px;height:68px}}
.shell:not(.conbg) #bg{display:none}

.c.chico:has(img.im3d){padding:2px 8px 2px 2px}.c.chico img.im3d{height:clamp(62px,12.4dvh,112px)}
@media(min-width:900px){.c:has(img.im3d){padding:6px 14px 6px 8px;gap:12px}.c img.im3d{height:clamp(100px,22dvh,190px)}.c.chico img.im3d{height:clamp(78px,15.5dvh,140px)}}
@media(min-width:900px) and (max-height:700px){.c img.im3d{height:clamp(92px,20dvh,150px)}.c.chico img.im3d{height:clamp(70px,14.5dvh,110px)}}

/* Cálculos del funnel de bajar de peso. Funciones puras, sin DOM: se usan en el quiz y en la oferta.
   Las cifras salen solo de acá (IMC, meta, semanas, fecha). El ritmo de 0,5 kg por semana es una estimación prudente, no una promesa. */
const CALC = {
  RITMO_KG_SEMANA: 0.5,
  LIMITES: { altura: [140, 220], peso: [40, 250] },

  /* IMC sin redondear. */
  imc(pesoKg, alturaCm) {
    const m = alturaCm / 100;
    return pesoKg / (m * m);
  },

  categoria(imc) {
    if (imc < 18.5) return 'bajo';
    if (imc < 25) return 'normal';
    if (imc < 30) return 'sobrepeso';
    return 'obesidad';
  },

  /* Peso más bajo que sigue dentro del rango normal para esa altura (IMC 18,5), redondeado hacia arriba. */
  pesoMinimoSano(alturaCm) {
    const m = alturaCm / 100;
    return Math.ceil(18.5 * m * m);
  },

  /* motivo: '' si está bien, 'igual' si la meta no es menor al peso actual, 'bajo' si queda por debajo del mínimo sano. */
  validarMeta(peso, meta, alturaCm) {
    const minimo = CALC.pesoMinimoSano(alturaCm);
    if (!Number.isFinite(peso) || !Number.isFinite(meta)) return { ok: false, motivo: 'igual', minimo };
    if (meta >= peso) return { ok: false, motivo: 'igual', minimo };
    if (meta < minimo) return { ok: false, motivo: 'bajo', minimo };
    return { ok: true, motivo: '', minimo };
  },

  /* Porcentaje del peso actual que hay que bajar, entero. */
  porcentaje(peso, meta) {
    return Math.round(((peso - meta) / peso) * 100);
  },

  semanas(peso, meta) {
    return Math.max(1, Math.ceil((peso - meta) / CALC.RITMO_KG_SEMANA));
  },

  fechaMeta(desdeDate, semanas) {
    const d = new Date(desdeDate.getTime());
    d.setDate(d.getDate() + semanas * 7);
    return d;
  },

  /* 'marzo de 2027' (es-AR), con meses propios para no depender del navegador. */
  mesAnio(date) {
    const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    return `${meses[date.getMonth()]} de ${date.getFullYear()}`;
  },

  /* Descenso suave de peso a meta: arranca un poco más rápido y se aplana al final, siempre bajando (sin rebotes).
     Devuelve `puntos` valores {x: 0..1, kg}; el primero es el peso actual y el último, la meta. */
  curva(peso, meta, puntos = 12) {
    const n = Math.max(2, Math.floor(puntos));
    const salida = [];
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1);
      const avance = 0.6 * x * (2 - x) + 0.4 * x;   // 0 en x=0, 1 en x=1, creciente
      salida.push({ x, kg: i === n - 1 ? meta : peso - (peso - meta) * avance });
    }
    return salida;
  },
};

if (typeof module !== 'undefined') module.exports = { CALC };

    }
  }

  const progreso = () => { $('barra').style.width = Math.max(4, Math.round((s / (S.length - 1)) * 100)) + '%'; };
  function siguiente() {
    vib();
    const e = raiz.firstElementChild;
    if (e) e.classList.add('sale');
    setTimeout(() => { s++; if (s >= S.length) return; dibuja(); }, 170);
  }

  /* ---------- Piezas ---------- */
  /* Igual que tarjeta() de quiz.js: muñeco a la izquierda y texto a la derecha; chico cuando hay 5 o 6 opciones. */
  function tarjeta(o, i, chico, multi) {
    return `<button class="c B${chico ? ' chico' : ''}" data-i="${i}"${multi ? ' aria-pressed="false"' : ''}>${multi ? '<span class="chk"></span>' : ''}${img3d(o[1])}<b>${esc(o[0])}${o[2] ? `<small>${esc(o[2])}</small>` : ''}</b></button>`;
  }
  /* Regalo de la primera pantalla: la misma franja .gift de quiz.js, con lo que este plan sí incluye. */
  const regaloPeso = () => `<div class="gift">${I_REGALO}<span>Con tu plan te llevás <b>de regalo</b> la guía de guardia y desplazamientos.</span></div>`;
  const filaIll = (img, tit, txt) => `<div class="ill">${img}<div><b>${esc(tit)}</b><span>${esc(txt)}</span></div></div>`;
  /* Chips honestos: lo único que se afirma es lo que el código cumple (peso y altura no salen del navegador). */
  const chipsPrivado = (conTiempo) => `<div class="chips">${conTiempo ? `<span>${I_RELOJ} 3 minutos</span>` : ''}<span>${I_CANDADO} Tu peso y tu altura no salen de tu celu</span></div>`;
  const NOMBRE_CAT = { bajo: 'Bajo peso', normal: 'Rango normal', sobrepeso: 'Sobrepeso', obesidad: 'Obesidad' };

  /* Barra de IMC con marcador: bajo hasta 18,5 · normal hasta 25 · sobrepeso hasta 30 · obesidad desde 30 (escala de 15 a 40). */
  function barraImc(imc) {
    imc = imc1(imc);
    const pos = Math.min(99, Math.max(1, ((imc - 15) / 25) * 100));
    return `<div class="imcb" role="img" aria-label="IMC ${coma(imc)}: ${NOMBRE_CAT[CALC.categoria(imc)]}"><s class="b0" style="width:14%"></s><s class="b1" style="width:26%"></s><s class="b2" style="width:20%"></s><s class="b3" style="width:40%"></s><i style="left:${pos.toFixed(1)}%"></i></div>` +
      '<div class="imcl"><span style="width:14%">Bajo</span><span style="width:26%">Normal</span><span style="width:20%">Sobrepeso</span><span style="width:40%">Obesidad</span></div>';
  }

  /* Proyección de peso de hoy a la meta con CALC.curva. */
  function grafico(peso, meta, fechaTxt) {
    const W = 320, H = window.innerHeight < 700 ? 106 : 134, pl = 16, pr = 16, pt = 34, pb = 34;   // más baja en celulares chicos para que el perfil entre sin scroll
    const pts = CALC.curva(peso, meta, 40);
    const rango = Math.max(1, peso - meta);
    const X = (x) => +(pl + x * (W - pl - pr)).toFixed(1);
    const Y = (kg) => +(pt + (1 - (kg - meta) / rango) * (H - pt - pb)).toFixed(1);
    const linea = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x)} ${Y(p.kg)}`).join('');
    const area = `${linea}L${X(1)} ${H - pb}L${X(0)} ${H - pb}Z`;
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de ${peso} kg hoy a ${meta} kg en ${esc(fechaTxt)}">` +
      '<defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16A34A" stop-opacity=".28"/><stop offset="1" stop-color="#16A34A" stop-opacity="0"/></linearGradient></defs>' +
      `<line x1="${pl}" y1="${H - pb}" x2="${W - pr}" y2="${H - pb}" stroke="#d6e0d9" stroke-width="1.5"/>` +
      `<line x1="${X(0)}" y1="${Y(meta)}" x2="${X(1)}" y2="${Y(meta)}" stroke="#16A34A" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>` +
      `<path d="${area}" fill="url(#gp)"/><path d="${linea}" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<circle cx="${X(0)}" cy="${Y(peso)}" r="5.5" fill="#fff" stroke="#0b0f0c" stroke-width="2.6"/><circle cx="${X(1)}" cy="${Y(meta)}" r="6.5" fill="#16A34A" stroke="#fff" stroke-width="2.4"/>` +
      `<text x="${X(0)}" y="${Y(peso) - 12}" font-size="13" font-weight="800" fill="#0b0f0c">Hoy ${peso} kg</text>` +
      `<text x="${X(1)}" y="${H - pb + 20}" font-size="13" font-weight="800" fill="#15803d" text-anchor="end">${meta} kg · ${esc(fechaTxt)}</text></svg>`;
  }

  /* Validación de los campos numéricos. Devuelve { ok, n, html, tono, incompleto } según lo tipeado. */
  function evaluaMedida(x, crudo) {
    const n = crudo ? parseInt(crudo, 10) : NaN;
    const vacio = { ok: false, n, html: '', tono: '' };
    if (!crudo) return vacio;
    if (x.k === 'altura') {
      const [lo, hi] = CALC.LIMITES.altura;
      if (n >= lo && n <= hi) return { ok: true, n, html: '', tono: '' };
      if (crudo.length < String(lo).length) return vacio;
      return { ok: false, n, html: `Ingresá una altura entre ${lo} y ${hi} cm.`, tono: 'err' };
    }
    if (x.k === 'peso') {
      const [lo, hi] = CALC.LIMITES.peso;
      if (!(n >= lo && n <= hi)) {
        if (crudo.length < String(lo).length) return vacio;
        return { ok: false, n, html: `Ingresá un peso entre ${lo} y ${hi} kg.`, tono: 'err' };
      }
      if (!A.altura) return { ok: true, n, html: '', tono: '' };
      const imc = imc1(CALC.imc(n, A.altura));
      const cat = CALC.categoria(imc);
      const cab = `<b>Tu IMC: ${coma(imc)}</b> <span class="cat">${NOMBRE_CAT[cat]}</span>`;
      const pie = '<small>El IMC es una referencia general.</small>';
      /* Pegado al mínimo sano no existe ninguna meta válida (peso > mínimo): se trata como bajo peso para no dejar un callejón sin salida en pesoMeta. */
      if (cat === 'bajo' || n <= CALC.pesoMinimoSano(A.altura)) return { ok: false, n, tono: 'bajo', html: `${cab}<p>Con tu altura y tu peso no necesitás bajar. Este plan no es para vos: consultá con un profesional.</p><a class="cta s" href="/quiz/">Ver el plan de técnica</a>` };
      if (cat === 'normal') return { ok: true, n, tono: 'ok', html: `${cab}<p>Estás en un rango normal. Igual podés mejorar cómo te sentís.</p>${pie}` };
      if (cat === 'sobrepeso') return { ok: true, n, tono: 'ok', html: `${cab}<p>Es un punto de partida, no un veredicto.</p>${pie}` };
      return { ok: true, n, tono: 'aviso', html: `${cab}<p>Es un punto de partida, no un veredicto. Consultá con tu médico antes de arrancar.</p>${pie}` };
    }
    /* pesoMeta */
    const alt = A.altura || 170, peso = A.peso || 0;
    const v = CALC.validarMeta(peso, n, alt);
    if (v.motivo === 'igual') return { ok: false, n, tono: 'err', html: 'Tu meta tiene que ser menor a tu peso actual.' };
    if (v.motivo === 'bajo') {
      if (crudo.length < String(v.minimo).length) return vacio;
      return { ok: false, n, tono: 'err', html: `Por tu altura, no te recomendamos bajar de ${v.minimo} kg.` };
    }
    const kg = peso - n;
    const exacto = (kg / peso) * 100;
    const cdc = exacto >= 5 && fuenteOk('beneficio')
      ? `<p>Perder entre 5 y 10% del peso corporal probablemente mejora la presión, el colesterol y la glucemia.</p><small>Fuente: ${enlaceFuente('CDC (archivo de 2018)', F.beneficio.url)}</small>`
      : '';
    return { ok: true, n, tono: 'ok', html: `<b>Son ${kg} kg${CALC.porcentaje(peso, n) >= 1 ? `, un ${CALC.porcentaje(peso, n)}% de tu peso` : ''}.</b>${cdc}` };
  }

  /* ---------- Dibujo de cada pantalla ---------- */
  function dibuja() {
    const x = S[s];
    bloqueado = false;
    setBg(x.video);
    forma.classList.toggle('alto', !!(x.alto || x.filas));   // «cuerpo», «meta» y «zonas» ocupan todo el alto de la ventana (peso.css)
    const llena = LLENAS[x.k] || (FIJAS.includes(x.t) ? 'fijo' : '');
    if (llena) forma.classList.add('alto');
    progreso();
    let h = '';
    if (x.t === 'q') {
      h = (x.pill ? pillPersonas() : '') + `<h2>${esc(x.titulo)}</h2>` + (x.sub ? `<p class="sub">${esc(x.sub)}</p>` : '') + (x.globo ? `<div class="globo">${esc(x.globo)}</div>` : '') +
        `<div class="grid">${x.o.map((o, i) => tarjeta(o, i, x.chico || x.o.length > 4, false)).join('')}</div>` + (x.regalo ? regaloPeso() : '');
    } else if (x.t === 'multi') {
      h = `<h2>${esc(x.titulo)}</h2><p class="sub">${esc(x.sub)}</p><div class="grid">${x.o.map((o, i) => tarjeta(o, i, true, true)).join('')}</div><button class="cta" id="seguir" disabled>Continuar</button>`;
    } else if (x.t === 'info30') {
      const m = fuenteOk('musculo');
      const txtMusculo = m ? 'La masa muscular baja aproximadamente 3 a 8% por década después de los 30.' : 'Con los años el cuerpo pierde algo de músculo.';
      const cita = m ? `<p class="cita">Fuente: ${enlaceFuente('Volpi, Nazemi y Fujita, ' + F.musculo.fecha + '. Curr Opin Clin Nutr Metab Care', F.musculo.url)}</p>` : '';
      h = `<h2>No es falta de voluntad: después de los 30 el cuerpo cambia</h2>` +
        filaIll(escena('info30', 0), 'Menos músculo', txtMusculo) +
        filaIll(escena('info30', 1), 'Menos tiempo', 'El trabajo, la familia y el cansancio le sacan lugar al movimiento.') +
        filaIll(escena('info30', 2), 'Sin plan, cuesta sostener', 'Es fácil arrancar fuerte, improvisar y largar a las pocas semanas.') +
        `${cita}<p class="sub cierre">Por eso conviene moverse con un plan, y no improvisar.</p><button class="cta" id="seguir">Seguir</button>`;
    } else if (x.t === 'infoboxeo') {
      h = `<h2>Por qué te sirve aunque nunca hayas boxeado</h2>` +
        filaIll(escena('infoboxeo', 0), 'Todo el cuerpo', 'Piernas, torso y brazos se mueven a la vez.') +
        filaIll(escena('infoboxeo', 1), 'Corto y en casa', 'Desde 15 minutos, sin equipo.') +
        filaIll(escena('infoboxeo', 2), 'Se hace llevadero', 'El timer te marca cuándo dar y cuándo descansar.') +
        '<button class="cta" id="seguir">Seguir</button>';
    } else if (x.t === 'noticia') {
      h = `<h2>¿Llegaste a ver esto?</h2><p class="sub">Un estudio sobre entrenamiento de boxeo</p>${tarjetaNoticiaPeso()}<button class="cta" id="seguir">Sí, lo vi</button><button class="cta s" id="seguir2">No, es la primera vez que lo veo</button>`;
    } else if (x.t === 'medida') {
      const previo = A[x.k] ? String(A[x.k]) : '';
      h = `<h2>${esc(x.titulo)}</h2><p class="sub">${esc(x.sub)}</p>${img3d(x.muneco, 'mu')}<div class="nbox"><input id="n" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="${esc(x.ph)}" aria-label="${esc(x.titulo)}" value="${esc(previo)}"><span>${esc(x.unidad)}</span></div><div class="msg" id="msg" role="status" aria-live="polite"></div><button class="cta" id="seguir" disabled>Seguir</button>`;
    } else if (x.t === 'experto') {
      h = `<div class="tag cen">Tu plan personalizado</div><h2>Tu análisis está casi listo</h2><p class="sub">Con tus respuestas ajustamos tu plan de 4 semanas al tiempo que tenés.</p>${tarjetaEspecialista()}${chipsPrivado(false)}<button class="cta" id="seguir">Ver mi análisis →</button>`;
    } else if (x.t === 'mail') {
      h = `<div class="tag cen">Ya casi</div><h2>Tu plan está casi listo</h2><p class="sub">Decinos cómo te llamás para personalizar tu plan.</p><input id="nm" type="text" placeholder="Tu nombre o apodo" autocomplete="given-name" value="${esc(A.nombre || '')}">${chipsPrivado(false)}<button class="cta" id="seguir">Ver mi plan</button>`;
    } else if (x.t === 'carga') {
      return cargando();
    } else if (x.t === 'perfil') {
      h = perfil();
    }
    raiz.innerHTML = `<div class="scr ${x.t}${x.video === 'hook' ? ' hook' : ''}${x.alto ? ' alto' : ''}${x.filas ? ' filas' : ''}${llena ? ' ' + llena : ''}">${h}</div>`;
    window.scrollTo(0, 0);
    enlaza(x);
  }

  function perfil() {
    const nom = esc(A.nombre || 'Campeón');
    const tienePeso = A.peso && A.altura;
    let h = `<div class="tag cen">Tu perfil</div><h2>${nom}, así queda tu plan</h2>`;
    if (tienePeso) {
      const imc = imc1(CALC.imc(A.peso, A.altura));
      h += `<div class="box"><div class="row"><b>Tu punto de partida</b><span class="vimc">IMC ${coma(imc)} · ${NOMBRE_CAT[CALC.categoria(imc)]}</span></div>${barraImc(imc)}</div>`;
    }
    if (tienePeso && A.pesoMeta && A.pesoMeta < A.peso) {
      const sem = CALC.semanas(A.peso, A.pesoMeta);
      const fecha = CALC.mesAnio(CALC.fechaMeta(new Date(), sem));
      h += `<div class="box"><b>Tu proyección</b>${grafico(A.peso, A.pesoMeta, fecha)}</div>`;
    }
    const ev = { 'Vacaciones': 'tus vacaciones', 'Un casamiento o evento': 'ese casamiento o evento', 'Un cumpleaños': 'tu cumpleaños' }[A.evento];
    if (ev) h += `<p class="evento">Tu plan de 4 semanas puede ser un primer paso hacia ${ev}.</p>`;
    h += '<p class="nota-est">Estimación a 0,5 kg por semana, un ritmo prudente. Tu plan dura 4 semanas; la fecha supone que seguís entrenando al mismo ritmo después. Depende de lo que comas, de tu descanso y de cuánto sostengas el plan. No es una promesa.';
    if (fuenteOk('ritmo')) h += ` Bajar de a poco ayuda a mantener el peso perdido (${enlaceFuente('CDC', F.ritmo.url)}).`;
    h += '</p><button class="cta" id="ver">Ver mi plan</button>';
    return h;
  }

  function enlaza(x) {
    const q = (sel) => raiz.querySelector(sel);
    if (x.t === 'q') {
      raiz.querySelectorAll('.c').forEach((b) => (b.onclick = () => {
        if (bloqueado) return;
        bloqueado = true;
        const o = x.o[+b.dataset.i];
        b.classList.add('on'); A[x.k] = o[0]; guardaA(); vib(); setTimeout(siguiente, 220);
      }));
    } else if (x.t === 'multi') {
      const sel = new Set();
      const tarjetas = [...raiz.querySelectorAll('.c')];
      tarjetas.forEach((b) => (b.onclick = () => {
        const i = +b.dataset.i;
        if (sel.has(i)) sel.delete(i);
        else {
          /* «Todo un poco» no se combina con las zonas puntuales. */
          if (x.solo !== undefined) { if (i === x.solo) sel.clear(); else sel.delete(x.solo); }
          sel.add(i);
        }
        tarjetas.forEach((c, j) => { c.classList.toggle('on', sel.has(j)); c.setAttribute('aria-pressed', sel.has(j) ? 'true' : 'false'); });
        q('#seguir').disabled = sel.size === 0; vib(8);
      }));
      q('#seguir').onclick = () => { A[x.k] = [...sel].sort((a, b) => a - b).map((i) => x.o[i][0]); guardaA(); siguiente(); };
    } else if (x.t === 'info30' || x.t === 'infoboxeo' || x.t === 'experto') {
      q('#seguir').onclick = siguiente;
    } else if (x.t === 'noticia') {
      q('#seguir').onclick = () => { A.noticia = 'si'; guardaA(); siguiente(); };
      q('#seguir2').onclick = () => { A.noticia = 'no'; guardaA(); siguiente(); };
    } else if (x.t === 'medida') {
      const inp = q('#n'), btn = q('#seguir'), msg = q('#msg');
      let valor = null;
      const revisa = () => {
        const limpio = inp.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 3);
        if (inp.value !== limpio) inp.value = limpio;
        const r = evaluaMedida(x, limpio);
        valor = r.ok ? r.n : null;
        btn.disabled = !r.ok;
        msg.innerHTML = r.html ? `<div class="m ${r.tono || ''}">${r.html}</div>` : '';
      };
      inp.addEventListener('input', revisa);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!btn.disabled) btn.click(); } });
      btn.onclick = () => {
        if (valor === null || bloqueado) return;
        bloqueado = true;
        A[x.k] = valor; guardaA(); siguiente();
      };
      revisa();
      try { inp.focus({ preventScroll: true }); } catch (e) {}
    } else if (x.t === 'mail') {
      /* Solo el nombre, y es opcional: sin nombre queda «Campeón». No se manda nada al servidor (el lead exige un mail y ya no se pide). */
      const sigue = () => {
        if (bloqueado) return;
        bloqueado = true;
        A.nombre = (q('#nm').value || '').trim().slice(0, 60) || 'Campeón'; guardaA();
        siguiente();
      };
      q('#seguir').onclick = sigue;
      q('#nm').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); sigue(); } });
    } else if (x.t === 'perfil') {
      q('#ver').onclick = () => { guardaA(); location.href = '/oferta-peso/'; };
    }
  }

  /* Carga: 6 mensajes de ~1,6 s cada uno. El análisis se frena en dos puntos hasta que la persona responde un pop-up. */
  function cargando() {
    const R = 402;
    const nom = A.nombre || 'Campeón';
    const imcTxt = A.peso && A.altura ? `Calculando tu punto de partida: IMC ${coma(CALC.imc(A.peso, A.altura))}` : 'Calculando tu punto de partida…';
    const detalleTiempo = { Arranque: '2-3 días · 15-30 min', Ritmo: '3-4 días · 30-40 min', Impulso: '4-5 días · 45-60 min' }[A.tiempo] || A.tiempo || '';
    const msgs = [
      'Analizando tus respuestas…',
      imcTxt,
      `Eligiendo el nivel de carga según tu tiempo: ${detalleTiempo}`,
      'Armando tu progresión desde cero…',
      'Armando tus 4 semanas de shadowboxing…',
      `Listo, ${nom}. Tu plan está armado.`,
    ];
    raiz.innerHTML = `<div class="scr carga"><h2>${esc(nom)}, estamos preparando tu plan</h2><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="64" stroke="#e5ebe6" stroke-width="11" fill="none"/><circle id="rc" cx="75" cy="75" r="64" stroke="#16A34A" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R}"/></svg><b id="pc">0%</b></div>${msgs.map((m, i) => `<div class="chkl" id="c${i}"><div class="ic"></div>${esc(m)}</div>`).join('')}</div>`;
    window.scrollTo(0, 0);
    let p = 0, pausa = false;
    const paso = 100 / msgs.length;                 // cada mensaje ocupa un sexto del avance
    const hitos = [
      { en: Math.round(paso * 2), pregunta: `${nom}, ¿podés entrenar a la misma hora todos los días?`, opc: ['Sí, ya tengo mi horario', 'Algunos días'], dato: 'Un horario fijo ayuda a sostener la constancia.', aviso: 'Anotado', clave: 'horaFija' },
      { en: Math.round(paso * 4), pregunta: '¿Preferís entrenar a la mañana o a la noche?', opc: ['A la mañana', 'A la noche'], dato: 'Elegí el momento en el que más rendís.', aviso: 'Anotado', clave: 'momento' },
    ];
    const marca = () => msgs.forEach((_, i) => { const e = $('c' + i); if (e && p >= (i + 1) * paso - 0.01) { e.classList.add('d'); e.querySelector('.ic').textContent = '✓'; } });
    const iv = setInterval(() => {
      if (pausa) return;
      p += 1; $('pc').textContent = p + '%'; $('rc').style.strokeDashoffset = R - (R * p) / 100;
      marca();
      const h = hitos.find((m) => p === m.en);
      if (h) {
        pausa = true;
        const v = document.createElement('div'); v.className = 'velo';
        v.innerHTML = `<div class="hoja"><div class="tag">Para terminar tu plan</div><h3>${esc(h.pregunta)}</h3><div class="globo">${esc(h.dato)}</div>${h.opc.map((t, i) => `<button class="cta${i ? ' s' : ''}" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
        document.body.appendChild(v);
        v.querySelectorAll('button').forEach((b) => (b.onclick = () => { A[h.clave] = h.opc[+b.dataset.i]; guardaA(); v.remove(); pausa = false; window.toast(h.aviso); }));
      }
      if (p >= 100) { clearInterval(iv); setTimeout(() => { if (S[s].t === 'carga') siguiente(); }, 900); }
    }, 96);                                          // 100 pasos x 96 ms ≈ 9,6 s (6 mensajes x 1,6 s)
  }

  /* El pie legal es fijo y su alto cambia con el ancho de la ventana: las pantallas a todo el alto (peso.css) llegan justo hasta él. */
  const ajustaPie = () => { const f = document.querySelector('.ft'); if (f) forma.style.setProperty('--pie', f.offsetHeight + 'px'); };
  piePeso();
  ajustaPie();
  window.addEventListener('resize', ajustaPie, { passive: true });
  dibuja();
  precargar();
})();

</script></body></html>
